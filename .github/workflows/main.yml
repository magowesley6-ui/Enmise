
name: ExtNoBrasil PC Gamer - Bodhi Linux + bVNC

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC exclusiva, de 6 a 8 caracteres"
        required: true
        type: string
      boot_mode:
        description: "Primeira vez: installer; depois: disk"
        required: true
        type: choice
        default: installer
        options:
          - installer
          - disk

permissions:
  contents: write

concurrency:
  group: extnobrasil-bodhi-pc
  cancel-in-progress: false

jobs:
  virtual-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Instalar dependencias
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils \
            novnc websockify socat curl wget \
            ca-certificates jq openssh-client python3-pil

          mkdir -p "$HOME/virtual-pc"

      - name: Criar papel de parede ExtNoBrasil
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$HOME/virtual-pc/wallpaper.png" <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import sys
          im = Image.new("RGB", (1280, 720), (5, 0, 3))
          d = ImageDraw.Draw(im)
          d.polygon([(900,0),(1280,0),(1280,720),(1080,720)],
                    fill=(55,0,8))
          d.line((0,650,800,0), fill=(190,0,20), width=4)
          d.line((300,720,1100,0), fill=(90,0,10), width=3)
          bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          f1 = ImageFont.truetype(bold, 72)
          f2 = ImageFont.truetype(bold, 42)
          d.text((640,280), "ExtNoBrasil", font=f1,
                 fill=(255,25,45), anchor="mm")
          d.text((640,370), "PC GAMER", font=f2,
                 fill=(245,245,245), anchor="mm")
          d.text((640,430), "BODHI LINUX | CUSTOM EDITION",
                 fill=(190,190,190), anchor="mm")
          im.save(sys.argv[1])
          PY

      - name: Restaurar ultimo checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/virtual-pc"

          TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            --jq '[.[] |
              select(.isDraft == false) |
              select(.tagName | startswith("bodhi-checkpoint-"))] |
              sort_by(.publishedAt) | last | .tagName // empty')"

          if [ -n "$TAG" ]; then
            echo "Restaurando $TAG"
            mkdir -p parts
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'bodhi-checkpoint-*.part' \
              --dir parts

            shopt -s nullglob
            FILES=(parts/bodhi-checkpoint-*.part)
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "ERRO: checkpoint sem arquivos."
              exit 1
            fi

            cat "${FILES[@]}" > bodhi-restored.qcow2
            qemu-img check bodhi-restored.qcow2
            mv bodhi-restored.qcow2 bodhi.qcow2
            rm -rf parts
            echo "Checkpoint restaurado."
          else
            echo "Nenhum checkpoint anterior."
          fi

      - name: Baixar ISO e preparar disco
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/virtual-pc"

          if [ ! -s bodhi.qcow2 ]; then
            qemu-img create -f qcow2 bodhi.qcow2 145G
          fi

          if [ ! -s bodhi.iso ]; then
            wget -O bodhi.iso \
              "https://sourceforge.net/projects/bodhilinux/files/7.0.0/bodhi-7.0.0-64.iso/download"
          fi

          test -s bodhi.iso
          qemu-img info bodhi.qcow2

      - name: Iniciar Bodhi, noVNC e tunel TCP
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
          BOOT_MODE: ${{ inputs.boot_mode }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$VNC_PASSWORD" =~ ^[A-Za-z0-9]{6,8}$ ]]; then
            echo "A senha deve ter de 6 a 8 letras ou numeros."
            exit 1
          fi
          echo "::add-mask::$VNC_PASSWORD"

          cd "$HOME/virtual-pc"
          MON=/tmp/bodhi-monitor.sock
          QLOG=/tmp/bodhi-qemu.log
          BLOG=/tmp/bodhi-websockify.log
          CLOG=/tmp/bodhi-cloudflared.log
          PLOG=/tmp/bodhi-pinggy.log

          QPID=""
          WPID=""
          CPID=""
          PPID_TUNNEL=""

          cleanup() {
            RC=$?
            trap - EXIT INT TERM
            set +e

            echo "Encerrando serviços..."

            if [ -S "$MON" ]; then
              printf 'system_powerdown\n' |
                socat -T 5 - UNIX-CONNECT:"$MON" >/dev/null 2>&1
            fi

            if [ -n "$QPID" ] && kill -0 "$QPID" 2>/dev/null; then
              sleep 5
              printf 'quit\n' |
                socat -T 5 - UNIX-CONNECT:"$MON" >/dev/null 2>&1
              sleep 2
              kill "$QPID" 2>/dev/null
              wait "$QPID" 2>/dev/null
            fi

            for PID in "$PPID_TUNNEL" "$CPID" "$WPID"; do
              [ -n "$PID" ] && kill "$PID" 2>/dev/null
            done

            if [ -s bodhi.qcow2 ] && qemu-img check bodhi.qcow2; then
              echo "Compactando checkpoint..."
              qemu-img convert -c -O qcow2 \
                bodhi.qcow2 checkpoint.qcow2

              mkdir -p checkpoint-parts
              split -b 1800M -d -a 4 \
                --additional-suffix=.part \
                checkpoint.qcow2 checkpoint-parts/bodhi-checkpoint-

              shopt -s nullglob
              FILES=(checkpoint-parts/bodhi-checkpoint-*.part)

              if [ "${#FILES[@]}" -gt 0 ]; then
                TAG="bodhi-checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                if gh release create "$TAG" "${FILES[@]}" \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "Bodhi Checkpoint ${GITHUB_RUN_ID}" \
                  --notes "Checkpoint automatico ExtNoBrasil"; then
                  echo "Checkpoint enviado: $TAG"
                else
                  echo "ERRO: falha ao enviar checkpoint."
                  RC=1
                fi
              else
                echo "ERRO: nenhuma parte do checkpoint foi criada."
                RC=1
              fi

              rm -rf checkpoint-parts checkpoint.qcow2
            else
              echo "ERRO: disco ausente ou inconsistente; backup ignorado."
              RC=1
            fi

            exit "$RC"
          }

          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=(-enable-kvm)
            CPU=host
          else
            ACCEL=(-accel tcg,thread=multi)
            CPU=max
            echo "Aviso: emulacao por software, pode ficar lenta."
          fi

          if [ "$BOOT_MODE" = "installer" ]; then
            BOOT=(-boot order=d,menu=on)
          else
            BOOT=(-boot order=c,menu=on)
          fi

          rm -f "$MON" "$QLOG"

          qemu-system-x86_64 \
            "${ACCEL[@]}" \
            -machine pc -cpu "$CPU" \
            -smp 2 -m 4096 \
            -drive file=bodhi.qcow2,format=qcow2,if=ide \
            -cdrom bodhi.iso \
            "${BOOT[@]}" \
            -vga std -usb -device usb-tablet \
            -rtc base=utc -display none \
            -vnc 127.0.0.1:1,password=on \
            -monitor unix:"$MON",server,nowait \
            > "$QLOG" 2>&1 &

          QPID=$!

          for i in $(seq 1 30); do
            [ -S "$MON" ] && break
            kill -0 "$QPID" 2>/dev/null || {
              cat "$QLOG"
              exit 1
            }
            sleep 2
          done

          [ -S "$MON" ] || {
            echo "Monitor QEMU nao iniciou."
            cat "$QLOG"
            exit 1
          }

          printf 'change vnc password %s\n' "$VNC_PASSWORD" |
            socat -T 5 - UNIX-CONNECT:"$MON" >/dev/null 2>&1

          websockify --web=/usr/share/novnc \
            6080 127.0.0.1:5901 > "$BLOG" 2>&1 &
          WPID=$!

          # Link para navegador: noVNC.
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate > "$CLOG" 2>&1 &
          CPID=$!

          WEB_URL=""
          for i in $(seq 1 60); do
            WEB_URL="$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              "$CLOG" | head -n 1 || true)"
            [ -n "$WEB_URL" ] && break
            sleep 2
          done

          # Túnel TCP temporário para o bVNC.
          # O Pinggy pode limitar ou alterar o serviço gratuito.
          ssh -p 443 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -R0:localhost:5901 \
            tcp@a.pinggy.io > "$PLOG" 2>&1 &
          PPID_TUNNEL=$!

          TCP_URL=""
          for i in $(seq 1 60); do
            TCP_URL="$(grep -Eo \
              'tcp://[^[:space:]]+' "$PLOG" | head -n 1 || true)"
            [ -n "$TCP_URL" ] && break
            sleep 2
          done

          echo
          echo "===== EXT NOBRASIL PC GAMER ====="
          echo "Sistema: Bodhi Linux"
          echo "Disco virtual: 145 GB"
          echo "RAM configurada: 4 GB"
          echo "Modo: $BOOT_MODE"
          echo "noVNC: ${WEB_URL}/vnc.html?autoconnect=true&resize=scale"

          if [ -n "$TCP_URL" ]; then
            echo "Endereco TCP para bVNC: $TCP_URL"
            echo "Use o host e a porta exibidos acima no bVNC."
          else
            echo "ATENCAO: nao foi possivel obter o endereco TCP."
            echo "Log Pinggy:"
            cat "$PLOG"
          fi

          echo "Senha VNC: a senha informada ao iniciar"
          echo "Mantenha esta execucao ativa durante o uso."
          echo "================================="

          START=$SECONDS
          while kill -0 "$QPID" 2>/dev/null; do
            if (( SECONDS - START >= 18000 )); then
              echo "Limite de sessao atingido."
              break
            fi
            sleep 5
          done
          

name: ExtNoBrasil PC Gamer - Garuda KDE FIX

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC (6 a 8 letras ou números)"
        required: true
        type: string
      boot_mode:
        description: "Inicialização"
        required: true
        type: choice
        options:
          - installer
          - disk
        default: installer

permissions:
  contents: read
  actions: write

concurrency:
  group: extnobrasil-pc-gamer
  cancel-in-progress: false

jobs:
  virtual-pc:
    name: ExtNoBrasil PC Virtual
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BOOT_MODE: ${{ inputs.boot_mode }}
      VNC_PASSWORD: ${{ inputs.vnc_password }}
      RAM_MB: "8192"
      CPU_COUNT: "4"
      DISK_SIZE: "80G"

    steps:
      - name: Instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils zstd socat \
            curl wget openssh-client ca-certificates python3

      - name: Preparar pastas
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/garuda" "$HOME/garuda-save"

      - name: Restaurar checkpoint
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/garuda-save/garuda.qcow2.zst
          key: garuda-extnobrasil-latest
          restore-keys: |
            garuda-extnobrasil-

      - name: Preparar disco e ISO
        shell: bash
        run: |
          set -Eeuo pipefail

          DISK="$HOME/garuda/garuda.qcow2"
          ISO="$HOME/garuda/garuda.iso"
          SAVE="$HOME/garuda-save/garuda.qcow2.zst"

          if [ -s "$SAVE" ]; then
            echo "Restaurando checkpoint anterior..."
            zstd -d -f "$SAVE" -o "$DISK"
            echo "RESTORED=sim" >> "$GITHUB_ENV"
          else
            echo "Criando disco virtual novo..."
            qemu-img create -f qcow2 "$DISK" "$DISK_SIZE"
            echo "RESTORED=não" >> "$GITHUB_ENV"
          fi

          if [ ! -s "$ISO" ]; then
            wget -O "$ISO" \
              "https://sourceforge.net/projects/garuda-linux/files/garuda/dr460nized/260819/garuda-dr460nized-linux-garuda-260819.iso/download"
          fi

      - name: Detectar aceleração
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ACCEL=kvm" >> "$GITHUB_ENV"
            echo "CPU_MODEL=host" >> "$GITHUB_ENV"
          else
            echo "ACCEL=tcg,thread=multi" >> "$GITHUB_ENV"
            echo "CPU_MODEL=max" >> "$GITHUB_ENV"
          fi

      - name: Iniciar QEMU com USB corrigido
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$HOME/garuda"
          DISK="$HOME/garuda/garuda.qcow2"
          ISO="$HOME/garuda/garuda.iso"
          MONITOR="$HOME/garuda/monitor.sock"
          LOG="$HOME/garuda/qemu.log"

          rm -f "$MONITOR"

          BOOT_ARGS=()
          if [ "$BOOT_MODE" = "installer" ]; then
            BOOT_ARGS=(-cdrom "$ISO" -boot order=d)
          else
            BOOT_ARGS=(-boot order=c)
          fi

          if [ "${#VNC_PASSWORD}" -lt 6 ] ||
             [ "${#VNC_PASSWORD}" -gt 8 ] ||
             [[ ! "$VNC_PASSWORD" =~ ^[a-zA-Z0-9]+$ ]]; then
            echo "ERRO: use uma senha com 6 a 8 letras ou números."
            exit 1
          fi

          echo "Modo: $BOOT_MODE"
          echo "Vídeo virtual: VGA padrão"
          echo "RAM configurada: $RAM_MB MB"
          echo "CPUs configuradas: $CPU_COUNT"
          echo "Aceleração: $ACCEL"

          qemu-system-x86_64 \
            -name "ExtNoBrasil PC Gamer" \
            -machine pc \
            -accel "$ACCEL" \
            -cpu "$CPU_MODEL" \
            -smp "$CPU_COUNT" \
            -m "$RAM_MB" \
            -vga std \
            -display none \
            -drive file="$DISK",format=qcow2,if=ide \
            "${BOOT_ARGS[@]}" \
            -device qemu-xhci,id=usb \
            -device usb-tablet,bus=usb.0 \
            -netdev user,id=net0 \
            -device e1000,netdev=net0 \
            -vnc 127.0.0.1:0,password=on \
            -monitor unix:"$MONITOR",server,nowait \
            -no-reboot \
            >"$LOG" 2>&1 &

          QEMU_PID=$!
          echo "$QEMU_PID" > "$HOME/garuda/qemu.pid"

          READY=false
          for i in $(seq 1 60); do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "ERRO: QEMU encerrou durante a inicialização."
              cat "$LOG" || true
              exit 1
            fi
            if [ -S "$MONITOR" ]; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "ERRO: monitor QEMU não ficou disponível."
            cat "$LOG" || true
            exit 1
          fi

          export MONITOR VNC_PASSWORD

          python3 <<'PY'
          import os, socket, time, sys

          path = os.environ["MONITOR"]
          password = os.environ["VNC_PASSWORD"]
          s = None

          for _ in range(60):
              try:
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.settimeout(5)
                  s.connect(path)
                  break
              except OSError:
                  if s:
                      s.close()
                  s = None
                  time.sleep(1)

          if s is None:
              print("ERRO: não foi possível conectar ao monitor QEMU.")
              sys.exit(1)

          def read_data(timeout=3):
              s.settimeout(timeout)
              data = b""
              try:
                  while True:
                      chunk = s.recv(4096)
                      if not chunk:
                          break
                      data += chunk
                      if b"(qemu)" in data.lower() or b"password:" in data.lower():
                          break
              except socket.timeout:
                  pass
              return data

          try:
              read_data()
              s.sendall(b"change vnc password\n")
              response = read_data()

              if b"password:" not in response.lower():
                  print("ERRO: QEMU não solicitou a senha VNC.")
                  print(response.decode(errors="replace"))
                  sys.exit(1)

              s.sendall(password.encode() + b"\n")
              print(read_data().decode(errors="replace"))
              print("Configuração da senha VNC enviada.")
          finally:
              s.close()
          PY

      - name: Abrir túnel TCP para bVNC
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$HOME/garuda/tunnel.log"

          # Encaminha a porta TCP pública diretamente para o VNC local.
          # O endereço e a porta públicos serão fornecidos pelo Pinggy.
          ssh -T \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -p 443 \
            -R 0:127.0.0.1:5900 \
            tcp@a.pinggy.io \
            2>&1 | tee "$LOG" &
          echo $! > "$HOME/garuda/tunnel.pid"

          for i in $(seq 1 30); do
            if grep -Eqi 'tcp://|[a-zA-Z0-9.-]+:[0-9]{4,5}' "$LOG"; then
              break
            fi
            sleep 2
          done

          echo
          echo "=============================================="
          echo " DETALHES DO PC VIRTUAL [BETA]"
          echo " Criador - ExtNoBrasil (ExT)"
          echo " Perfil do Discord - Brasil_kill0"
          echo "=============================================="

          python3 <<'PY'
          import re
          from pathlib import Path

          log = Path.home() / "garuda" / "tunnel.log"
          content = log.read_text(errors="replace")

          # Tenta reconhecer o endereço TCP público divulgado pelo túnel.
          matches = re.findall(
              r'(?:tcp://)?([a-zA-Z0-9.-]+):([0-9]{2,5})',
              content
          )

          chosen = None
          for host, port in matches:
              if host in ("127.0.0.1", "localhost") or port in ("22", "443"):
                  continue
              chosen = (host, port)
              break

          if chosen:
              print("Endereço de Servidor:")
              print(chosen[0])
              print()
              print("Porta:")
              print(chosen[1])
          else:
              print("Endereço de Servidor:")
              print("Confira o log do túnel abaixo.")
              print()
              print("Porta:")
              print("Confira o log do túnel abaixo.")

          print()
          print("Senha: a senha VNC informada ao iniciar o workflow")
          print("==============================================")
          print()
          print("LOG DO TÚNEL:")
          print(content[-6000:])
          PY

      - name: Manter sessão ativa
        shell: bash
        run: |
          set -Eeuo pipefail
          QEMU_PID="$(cat "$HOME/garuda/qemu.pid")"

          while kill -0 "$QEMU_PID" 2>/dev/null; do
            sleep 15
          done

          echo "A sessão QEMU terminou."

      - name: Encerrar e salvar checkpoint
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          MONITOR="$HOME/garuda/monitor.sock"
          DISK="$HOME/garuda/garuda.qcow2"
          SAVE="$HOME/garuda-save/garuda.qcow2.zst"

          if [ -S "$MONITOR" ]; then
            printf 'quit\n' |
              socat - UNIX-CONNECT:"$MONITOR" >/dev/null 2>&1 || true
          fi

          for file in qemu.pid tunnel.pid; do
            if [ -f "$HOME/garuda/$file" ]; then
              kill "$(cat "$HOME/garuda/$file")" 2>/dev/null || true
            fi
          done

          sleep 2

          if [ ! -s "$DISK" ]; then
            echo "Disco não encontrado; checkpoint não foi salvo."
            exit 0
          fi

          echo "Compactando checkpoint..."
          zstd -T0 -1 -f "$DISK" -o "$SAVE"

          SIZE=$(stat -c%s "$SAVE")
          MAX_SIZE=$((9800 * 1024 * 1024))

          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Checkpoint acima de 9,8 GB; não será enviado ao cache."
            rm -f "$SAVE"
            exit 0
          fi

          echo "SAVE_READY=true" >> "$GITHUB_ENV"
          echo "Checkpoint pronto: $SIZE bytes"

      - name: Guardar checkpoint no cache
        if: always() && env.SAVE_READY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/garuda-save/garuda.qcow2.zst
          key: garuda-extnobrasil-${{ github.run_id }}-${{ github.run_attempt }}

name: ExtNoBrasil PC Gamer - Garuda KDE FIX

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC: 1 a 8 letras ou números"
        required: true
        type: string
      boot_mode:
        description: "Use installer na instalação inicial e disk depois"
        required: true
        type: choice
        options:
          - installer
          - disk
        default: installer

permissions:
  contents: read
  actions: write

jobs:
  garuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      VNC_PASS: ${{ inputs.vnc_password }}
      BOOT_MODE: ${{ inputs.boot_mode }}

    steps:
      - name: Instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$VNC_PASS" =~ ^[a-zA-Z0-9]{1,8}$ ]]; then
            echo "ERRO: use de 1 a 8 letras ou números na senha."
            exit 1
          fi

          echo "::add-mask::$VNC_PASS"

          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils \
            curl wget ca-certificates \
            zstd socat openssh-client python3

          mkdir -p "$HOME/garuda" "$HOME/garuda-save"

      - name: Restaurar checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ~/garuda-save/garuda.qcow2.zst
          key: garuda-extnobrasil-latest
          restore-keys: |
            garuda-extnobrasil-

      - name: Preparar disco e ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/garuda"

          ISO_URL="https://sourceforge.net/projects/garuda-linux/files/garuda/dr460nized/260819/garuda-dr460nized-linux-garuda-260819.iso/download"

          if [ -s "$HOME/garuda-save/garuda.qcow2.zst" ]; then
            echo "Checkpoint encontrado. Verificando arquivo..."
            zstd -t "$HOME/garuda-save/garuda.qcow2.zst"

            zstd -d -f \
              "$HOME/garuda-save/garuda.qcow2.zst" \
              -o garuda.qcow2
          fi

          if [ ! -s garuda.qcow2 ]; then
            echo "Criando disco virtual de 80 GB..."
            qemu-img create -f qcow2 garuda.qcow2 80G
          fi

          if [ "$BOOT_MODE" = "installer" ]; then
            echo "Baixando ISO do Garuda..."
            curl -fL --retry 3 --retry-delay 5 \
              "$ISO_URL" -o garuda.iso
            test -s garuda.iso
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ACCEL=kvm" >> "$GITHUB_ENV"
            echo "CPU_MODEL=host" >> "$GITHUB_ENV"
            echo "KVM disponível."
          else
            echo "ACCEL=tcg,thread=multi" >> "$GITHUB_ENV"
            echo "CPU_MODEL=max" >> "$GITHUB_ENV"
            echo "AVISO: sem KVM, o sistema ficará mais lento."
          fi

      - name: Iniciar Garuda com vídeo corrigido
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/garuda"

          # Remove socket antigo que poderia causar conexão recusada.
          rm -f "$HOME/garuda/monitor.sock"

          RAM_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          RAM_MB=$((RAM_MB - 1800))

          (( RAM_MB > 8192 )) && RAM_MB=8192
          (( RAM_MB < 2048 )) && RAM_MB=2048

          CPU_COUNT=$(nproc)
          (( CPU_COUNT > 4 )) && CPU_COUNT=4

          QEMU_ARGS=(
            -machine pc
            -accel "$ACCEL"
            -cpu "$CPU_MODEL"
            -smp "$CPU_COUNT"
            -m "${RAM_MB}M"
            -drive file=garuda.qcow2,if=ide,format=qcow2
            -vga std
            -display none
            -device usb-tablet
            -netdev user,id=net0
            -device e1000,netdev=net0
            -vnc 127.0.0.1:0,password=on
            -monitor unix:"$HOME/garuda/monitor.sock",server,nowait
            -no-reboot
          )

          if [ "$BOOT_MODE" = "installer" ]; then
            QEMU_ARGS+=(-cdrom garuda.iso -boot order=d)
          else
            QEMU_ARGS+=(-boot order=c)
          fi

          echo "Modo: $BOOT_MODE"
          echo "Vídeo virtual: VGA padrão"
          echo "RAM configurada: ${RAM_MB} MB"
          echo "CPUs configuradas: ${CPU_COUNT}"
          echo "Aceleração: $ACCEL"

          nohup qemu-system-x86_64 "${QEMU_ARGS[@]}" \
            > "$HOME/garuda/qemu.log" 2>&1 &

          echo $! > "$HOME/garuda/qemu.pid"

          # Aguarda o QEMU criar o socket do monitor.
          READY=false
          for i in $(seq 1 60); do
            if ! kill -0 "$(cat "$HOME/garuda/qemu.pid")" 2>/dev/null; then
              echo "ERRO: QEMU encerrou durante a inicialização."
              cat "$HOME/garuda/qemu.log"
              exit 1
            fi

            if [ -S "$HOME/garuda/monitor.sock" ]; then
              READY=true
              break
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "ERRO: monitor não foi criado."
            cat "$HOME/garuda/qemu.log"
            exit 1
          fi

          # Tenta conectar repetidamente: o socket pode existir
          # alguns instantes antes de aceitar conexões.
          if ! python3 - "$VNC_PASS" "$HOME/garuda/monitor.sock" <<'PY'
          import socket
          import sys
          import time

          password, path = sys.argv[1], sys.argv[2]
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(2)

          connected = False
          for attempt in range(60):
              try:
                  s.connect(path)
                  connected = True
                  break
              except (ConnectionRefusedError, FileNotFoundError, socket.timeout):
                  time.sleep(1)

          if not connected:
              print("ERRO: não foi possível conectar ao monitor do QEMU.")
              sys.exit(1)

          def read_until(marker, timeout=8):
              data = b""
              end = time.time() + timeout
              while time.time() < end:
                  try:
                      chunk = s.recv(4096)
                      if not chunk:
                          break
                      data += chunk
                      if marker in data:
                          break
                  except socket.timeout:
                      break
              return data

          try:
              # Espera o monitor apresentar seu prompt.
              read_until(b"(qemu)", timeout=3)

              s.sendall(b"change vnc password\n")
              response = read_until(b"Password:", timeout=5)

              if b"Password:" not in response:
                  print("ERRO: QEMU não solicitou a senha VNC.")
                  print(response.decode(errors="replace"))
                  sys.exit(2)

              s.sendall(password.encode("ascii") + b"\n")
              time.sleep(1)

              try:
                  print(s.recv(4096).decode(errors="replace"))
              except socket.timeout:
                  pass

              print("Comando de configuração da senha enviado.")
          finally:
              s.close()
          PY
          then
            echo "Falha ao configurar a senha. Log do QEMU:"
            cat "$HOME/garuda/qemu.log"
            exit 1
          fi

          echo "QEMU iniciado. A VM está em execução."

      - name: Abrir túnel para bVNC
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/garuda"

          nohup ssh -T \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -p 443 \
            -R 0:127.0.0.1:5900 \
            tcp@a.pinggy.io \
            > "$HOME/garuda/tunnel.log" 2>&1 &

          echo $! > "$HOME/garuda/tunnel.pid"

          for i in $(seq 1 60); do
            if grep -Eqi 'tcp://|\.pinggy\.link|\.pinggy\.io' \
              "$HOME/garuda/tunnel.log"; then
              break
            fi

            if ! kill -0 "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          cat "$HOME/garuda/tunnel.log"

          if ! kill -0 "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null; then
            echo "ERRO: o túnel não iniciou."
            exit 1
          fi

      - name: Manter sessão ativa
        shell: bash
        run: |
          set -Eeuo pipefail

          while kill -0 "$(cat "$HOME/garuda/qemu.pid")" 2>/dev/null; do
            if ! kill -0 "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null; then
              echo "Túnel desconectado."
              break
            fi
            sleep 20
          done

      - name: Encerrar VM e túnel
        if: always()
        shell: bash
        run: |
          if [ -S "$HOME/garuda/monitor.sock" ]; then
            printf 'quit\n' |
              socat - UNIX-CONNECT:"$HOME/garuda/monitor.sock" || true
          fi

          if [ -f "$HOME/garuda/qemu.pid" ]; then
            kill "$(cat "$HOME/garuda/qemu.pid")" 2>/dev/null || true
          fi

          if [ -f "$HOME/garuda/tunnel.pid" ]; then
            kill "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null || true
          fi

          sleep 2

      - name: Compactar checkpoint
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          DISK="$HOME/garuda/garuda.qcow2"
          SAVE="$HOME/garuda-save"

          if [ ! -s "$DISK" ]; then
            echo "Disco não encontrado; checkpoint não criado."
            exit 0
          fi

          mkdir -p "$SAVE"

          zstd -T0 -1 -f "$DISK" \
            -o "$SAVE/garuda.qcow2.zst"

          SIZE=$(stat -c%s "$SAVE/garuda.qcow2.zst")
          echo "Tamanho do checkpoint: $SIZE bytes"

          if [ "$SIZE" -gt 9800000000 ]; then
            echo "Checkpoint excede o limite configurado."
            exit 1
          fi

          echo "SAVE_READY=true" >> "$GITHUB_ENV"

      - name: Salvar checkpoint no cache
        if: ${{ always() && env.SAVE_READY == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/garuda-save/garuda.qcow2.zst
          key: garuda-extnobrasil-${{ github.run_id }}-${{ github.run_attempt }}

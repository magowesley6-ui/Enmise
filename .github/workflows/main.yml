name: ExtNoBrasil PC Virtual - Garuda Separado

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC (6 a 8 letras ou números)"
        required: true
        type: string

      boot_mode:
        description: "Inicialização do PC virtual"
        required: true
        type: choice
        options:
          - installer
          - disk
        default: installer

      disk_size:
        description: "Capacidade virtual do disco"
        required: true
        type: choice
        options:
          - 80G
          - 200G
          - 500G
          - 1T
        default: 80G

permissions:
  contents: read
  actions: write

concurrency:
  group: extnobrasil-pc-virtual
  cancel-in-progress: false

jobs:
  pc-virtual:
    name: Servidor do gabinete virtual
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      VM_DIR: ${{ github.workspace }}/pc-virtual
      SAVE_DIR: ${{ github.workspace }}/pc-save
      DISK_SIZE: ${{ inputs.disk_size }}
      BOOT_MODE: ${{ inputs.boot_mode }}
      VNC_PASSWORD: ${{ inputs.vnc_password }}

    steps:
      - name: Preparar servidor e ferramentas
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            zstd \
            socat \
            curl \
            wget \
            openssh-client \
            python3 \
            ca-certificates

          mkdir -p "$VM_DIR" "$SAVE_DIR"

          echo "=== EXT NOBRASIL PC VIRTUAL ==="
          echo "Servidor: GitHub Actions"
          echo "Virtualizador: QEMU"
          echo "Sistema: Garuda Linux"
          echo "GPU: adaptador virtual, sem GPU física dedicada"
          echo "Disco virtual solicitado: $DISK_SIZE"

          echo
          echo "=== RECURSOS DISPONÍVEIS ==="
          nproc
          free -h
          df -h "$VM_DIR"

          if [[ -w /dev/kvm ]]; then
            echo "KVM acessível: sim"
          else
            echo "KVM acessível: não confirmado"
          fi

      # O cache é uma tentativa de persistência, não um HD permanente.
      - name: Restaurar checkpoint do sistema
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: pc-save/garuda.qcow2.zst
          key: garuda-extnobrasil-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            garuda-extnobrasil-

      - name: Recuperar ou criar o disco do sistema
        shell: bash
        run: |
          set -Eeuo pipefail

          DISK="$VM_DIR/garuda.qcow2"
          SAVED="$SAVE_DIR/garuda.qcow2.zst"

          if [[ -s "$SAVED" ]]; then
            echo "Checkpoint encontrado. Descompactando..."
            zstd -d -T0 -f "$SAVED" -o "$DISK"
          else
            echo "Nenhum checkpoint restaurado."
          fi

          if [[ ! -s "$DISK" ]]; then
            echo "Criando disco virtual esparso de $DISK_SIZE..."
            qemu-img create -f qcow2 "$DISK" "$DISK_SIZE"
          else
            echo "Disco existente encontrado."
            qemu-img info "$DISK"
          fi

          echo "DISK_PATH=$DISK" >> "$GITHUB_ENV"

      - name: Baixar ISO do Garuda quando necessário
        if: ${{ inputs.boot_mode == 'installer' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ISO="$VM_DIR/garuda.iso"

          # URL da edição Dr460nized usada neste modelo.
          # Se o projeto mover essa versão, atualize a URL.
          ISO_URL="https://sourceforge.net/projects/garuda-linux/files/garuda/dr460nized/260819/garuda-dr460nized-linux-garuda-260819.iso/download"

          if [[ ! -s "$ISO" ]]; then
            echo "Iniciando download da ISO..."
            echo "O tempo depende do espelho e da rede do runner."

            wget \
              --timeout=45 \
              --tries=3 \
              --progress=dot:giga \
              -O "$ISO" \
              "$ISO_URL"
          fi

          if [[ ! -s "$ISO" ]]; then
            echo "ERRO: a ISO não foi baixada."
            exit 1
          fi

          echo "ISO pronta:"
          ls -lh "$ISO"
          echo "ISO_PATH=$ISO" >> "$GITHUB_ENV"

      - name: Configurar o servidor do gabinete
        shell: bash
        run: |
          set -Eeuo pipefail

          # A configuração é separada do arquivo do sistema operacional.
          CPU_COUNT="$(nproc)"
          VM_CPUS="$CPU_COUNT"

          if (( VM_CPUS > 4 )); then
            VM_CPUS=4
          fi
          if (( VM_CPUS < 1 )); then
            VM_CPUS=1
          fi

          MEM_MB="$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)"
          VM_RAM=$((MEM_MB - 2048))

          if (( VM_RAM > 4096 )); then
            VM_RAM=4096
          fi
          if (( VM_RAM > 6144 )); then
            VM_RAM=6144
          fi
          if (( VM_RAM < 1024 )); then
            VM_RAM=1024
          fi

          if [[ -w /dev/kvm ]]; then
            ACCEL_ARGS=(-enable-kvm -cpu host)
            echo "Aceleração KVM habilitada."
          else
            ACCEL_ARGS=(-accel tcg,thread=multi -cpu max)
            echo "KVM indisponível; usando emulação por software."
          fi

          printf 'VM_CPUS=%s\n' "$VM_CPUS" >> "$GITHUB_ENV"
          printf 'VM_RAM=%s\n' "$VM_RAM" >> "$GITHUB_ENV"

          echo "CPU virtual: $VM_CPUS"
          echo "RAM virtual: ${VM_RAM} MB"
          echo "Disco: $DISK_SIZE"
          echo "Gráficos: adaptador virtual QEMU"
          echo "GPU física dedicada: não fornecida"

      - name: Iniciar o PC virtual
        shell: bash
        run: |
          set -Eeuo pipefail

          DISK="$DISK_PATH"
          MONITOR="$VM_DIR/monitor.sock"
          LOG="$VM_DIR/qemu.log"
          PIDFILE="$VM_DIR/qemu.pid"

          QEMU_ARGS=(
            -name "ExtNoBrasil-PC-Virtual"
            -machine q35
            -smp "$VM_CPUS"
            -m "$VM_RAM"
            -drive "file=$DISK,format=qcow2,if=virtio"
            -vga virtio
            -display none
            -device qemu-xhci,id=usb
            -device usb-tablet,bus=usb.0
            -netdev user,id=net0
            -device e1000,netdev=net0
            -vnc 127.0.0.1:0,password=on
            -monitor "unix:$MONITOR,server=on,wait=off"
            -no-reboot
          )

          if [[ "$BOOT_MODE" == "installer" ]]; then
            QEMU_ARGS+=(
              -cdrom "$ISO_PATH"
              -boot order=d,menu=on
            )
          else
            QEMU_ARGS+=(-boot order=c)
          fi

          # Tenta usar KVM; se não existir, usa emulação por software.
          if [[ -w /dev/kvm ]]; then
            qemu-system-x86_64 \
              -enable-kvm \
              -cpu host \
              "${QEMU_ARGS[@]}" \
              > "$LOG" 2>&1 &
          else
            qemu-system-x86_64 \
              -accel tcg,thread=multi \
              -cpu max \
              "${QEMU_ARGS[@]}" \
              > "$LOG" 2>&1 &
          fi

          echo "$!" > "$PIDFILE"

          for i in $(seq 1 30); do
            if [[ -S "$MONITOR" ]]; then
              break
            fi

            if ! kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
              cat "$LOG"
              echo "QEMU encerrou durante a inicialização."
              exit 1
            fi

            sleep 1
          done

          if [[ ! -S "$MONITOR" ]]; then
            cat "$LOG"
            echo "O monitor QEMU não iniciou."
            exit 1
          fi

          # Configura a senha VNC pelo monitor local.
          python3 - "$MONITOR" "$VNC_PASSWORD" <<'PY'
          import socket
          import sys
          import time

          path, password = sys.argv[1], sys.argv[2]

          if not (6 <= len(password) <= 8):
              raise SystemExit("A senha precisa ter de 6 a 8 caracteres.")

          if not password.isalnum():
              raise SystemExit("Use somente letras e números na senha.")

          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)

          for _ in range(30):
              try:
                  s.connect(path)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Não foi possível conectar ao monitor QEMU.")

          s.settimeout(3)
          time.sleep(0.5)
          try:
              s.recv(4096)
          except OSError:
              pass

          s.sendall(b"change vnc password\n")
          time.sleep(0.3)
          try:
              s.recv(4096)
          except OSError:
              pass

          s.sendall(password.encode("ascii") + b"\n")
          time.sleep(0.5)

          try:
              response = s.recv(4096).decode("utf-8", "replace")
              print(response)
          except OSError:
              pass

          s.close()
          print("Comando de configuração da senha enviado.")
          PY

          echo "PC virtual iniciado."
          echo "VNC local: 127.0.0.1:5900"
          echo "O acesso externo será exibido no próximo passo."

      - name: Abrir túnel TCP para o bVNC
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$VM_DIR"
          : > tunnel.log

          # O túnel é externo ao GitHub. Sua disponibilidade não é garantida.
          ssh -T \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -p 443 \
            -R 0:127.0.0.1:5900 \
            tcp@a.pinggy.io \
            > tunnel.log 2>&1 &

          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > tunnel.pid

          echo "Aguardando o endereço TCP do túnel..."

          FOUND=0
          for i in $(seq 1 60); do
            if grep -Eiq 'tcp://|[a-zA-Z0-9.-]+:[0-9]{4,5}' tunnel.log; then
              FOUND=1
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          cat tunnel.log

          if (( FOUND == 0 )); then
            echo "Não foi possível confirmar o endereço TCP."
            echo "Consulte o log do túnel para verificar o erro."
            exit 1
          fi

          echo
          echo "=== DADOS PARA O bVNC ==="
          echo "Servidor VNC interno: 127.0.0.1"
          echo "Porta VNC interna: 5900"
          echo "Use no bVNC o HOST e a PORTA EXTERNOS anunciados acima."
          echo "Senha: a que você informou ao iniciar o workflow."
          echo "Não use tcp:// como parte do campo de endereço."

      - name: Manter o PC virtual ligado
        shell: bash
        run: |
          set -Eeuo pipefail

          PIDFILE="$VM_DIR/qemu.pid"
          PID="$(cat "$PIDFILE")"

          echo "=== EXT NOBRASIL PC VIRTUAL [BETA] ==="
          echo "Criador - ExtNoBrasil (ExT)"
          echo "Perfil do Discord - Brasil_kill0"
          echo "Sistema: Garuda Linux"
          echo "CPU virtual: $VM_CPUS"
          echo "RAM virtual: ${VM_RAM} MB"
          echo "Capacidade de disco: $DISK_SIZE"
          echo "GPU: adaptador virtual, sem GPU física dedicada"
          echo "A sessão dura enquanto o job e o túnel permanecerem ativos."

          while kill -0 "$PID" 2>/dev/null; do
            sleep 15
          done

          echo "O processo QEMU terminou."
          cat "$VM_DIR/qemu.log"
          exit 1

      - name: Salvar checkpoint do disco
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          DISK="$VM_DIR/garuda.qcow2"
          OUT="$SAVE_DIR/garuda.qcow2.zst"

          # Encerra os processos que ainda possam estar escrevendo no disco.
          if [[ -f "$VM_DIR/qemu.pid" ]]; then
            PID="$(cat "$VM_DIR/qemu.pid")"
            kill "$PID" 2>/dev/null
            for i in $(seq 1 10); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
            kill -9 "$PID" 2>/dev/null
          fi

          if [[ -f "$VM_DIR/tunnel.pid" ]]; then
            kill "$(cat "$VM_DIR/tunnel.pid")" 2>/dev/null
          fi

          if [[ -s "$DISK" ]]; then
            echo "Compactando o disco virtual para tentar salvar checkpoint..."
            mkdir -p "$SAVE_DIR"

            if zstd -T0 -3 -f "$DISK" -o "$OUT"; then
              SIZE="$(stat -c '%s' "$OUT")"
              echo "Tamanho compactado: $SIZE bytes"

              # Limite conservador para evitar enviar um cache enorme.
              if (( SIZE <= 9500000000 )); then
                echo "Checkpoint compactado disponível."
              else
                echo "Checkpoint maior que o limite conservador."
                rm -f "$OUT"
              fi
            else
              echo "Falha ao compactar o disco."
              rm -f "$OUT"
            fi
          else
            echo "Nenhum disco disponível para checkpoint."
          fi

      - name: Publicar checkpoint no cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: pc-save/garuda.qcow2.zst
          key: garuda-extnobrasil-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Resumo final
        if: ${{ always() }}
        shell: bash
        run: |
          echo "ExtNoBrasil PC Virtual encerrado."
          echo "O cache pode não ter sido salvo ou poderá ser removido."
          echo "Para manter dados importantes, baixe backups para outro armazenamento."

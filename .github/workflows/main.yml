
name: ExtNoBrasil PC Gamer - Bodhi Linux Preto e Vermelho

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC de 6 a 8 letras ou numeros"
        required: true
        type: string
      boot_mode:
        description: "Primeira execucao installer; depois disk"
        required: true
        type: choice
        default: installer
        options:
          - installer
          - disk

permissions:
  contents: write

concurrency:
  group: extnobrasil-bodhi-pc
  cancel-in-progress: false

jobs:
  virtual-pc:
    name: ExtNoBrasil PC Virtual Bodhi
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Instalar dependencias e criar papel de parede
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils \
            novnc websockify socat curl wget \
            ca-certificates jq python3-pil \
            guestfs-tools

          DIR="$HOME/virtual-pc"
          mkdir -p "$DIR"

          # Gera o papel de parede sem precisar baixar uma imagem.
          python3 - "$DIR/extnobrasil-wallpaper.png" <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import sys, math

          W, H = 1920, 1080
          im = Image.new("RGB", (W, H))
          px = im.load()

          for y in range(H):
              for x in range(W):
                  glow = max(0, 1 - math.sqrt(
                      ((x - 1550) / 900) ** 2 +
                      ((y - 780) / 700) ** 2
                  ))
                  red = int(5 + glow * 65)
                  px[x, y] = (red, 0, 2)

          d = ImageDraw.Draw(im)
          d.polygon([(1200,0),(1920,0),(1920,1080),(1600,1080)],
                    fill=(24,0,2))
          d.line((0,900,900,0), fill=(220,0,20), width=4)
          d.line((300,1080,1380,0), fill=(100,0,8), width=3)

          font_bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font_regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          title_font = ImageFont.truetype(font_bold, 100)
          sub_font = ImageFont.truetype(font_bold, 57)
          small_font = ImageFont.truetype(font_regular, 25)

          title = "ExtNoBrasil"
          box = d.textbbox((0,0), title, font=title_font)
          d.text(((W-(box[2]-box[0]))/2, 385), title,
                 font=title_font, fill=(255,25,40),
                 stroke_width=1, stroke_fill=(90,0,0))

          subtitle = "PC GAMER"
          box = d.textbbox((0,0), subtitle, font=sub_font)
          d.text(((W-(box[2]-box[0]))/2, 510), subtitle,
                 font=sub_font, fill=(245,245,245))

          d.rounded_rectangle((700,600,1220,608), radius=4,
                              fill=(255,20,35))

          small = "BODHI LINUX  |  CUSTOM EDITION"
          box = d.textbbox((0,0), small, font=small_font)
          d.text(((W-(box[2]-box[0]))/2, 650), small,
                 font=small_font, fill=(190,190,190))

          im.save(sys.argv[1], optimize=True)
          print("Papel de parede ExtNoBrasil criado.")
          PY

      - name: Restaurar ultimo checkpoint Bodhi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR="$HOME/virtual-pc"
          DISK="$DIR/bodhi.qcow2"
          PARTS="$DIR/restore-parts"
          JOINED="$DIR/restored-bodhi.qcow2"

          mkdir -p "$DIR"

          TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            --jq '[.[] |
              select(.isDraft == false) |
              select(.tagName | startswith("bodhi-checkpoint-"))] |
              sort_by(.publishedAt) | last | .tagName // empty')"

          if [ -n "$TAG" ]; then
            echo "Restaurando checkpoint: $TAG"
            mkdir -p "$PARTS"

            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'bodhi-checkpoint-*.part' \
              --dir "$PARTS"

            shopt -s nullglob
            FILES=("$PARTS"/bodhi-checkpoint-*.part)

            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "ERRO: checkpoint sem partes."
              exit 1
            fi

            cat "${FILES[@]}" > "$JOINED"
            rm -rf "$PARTS"

            qemu-img check "$JOINED"
            mv "$JOINED" "$DISK"
            echo "Checkpoint restaurado."
          else
            echo "Nenhum checkpoint Bodhi anterior."
          fi

      - name: Preparar disco e ISO do Bodhi Linux
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR="$HOME/virtual-pc"
          DISK="$DIR/bodhi.qcow2"
          ISO="$DIR/bodhi.iso"

          if [ ! -s "$DISK" ]; then
            qemu-img create -f qcow2 "$DISK" 145G
          fi

          if [ ! -s "$ISO" ]; then
            URL="https://sourceforge.net/projects/bodhilinux/files/7.0.0/bodhi-7.0.0-64.iso/download"

            if ! wget --content-disposition \
              -O "$ISO" "$URL"; then
              rm -f "$ISO"
              echo "ERRO: nao foi possivel baixar a ISO."
              echo "Confira a ISO oficial do Bodhi Linux e atualize a URL."
              exit 1
            fi
          fi

          test -s "$ISO"
          qemu-img info "$DISK"

      - name: Iniciar PC virtual, personalizar e salvar checkpoint
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
          BOOT_MODE: ${{ inputs.boot_mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$VNC_PASSWORD" =~ ^[A-Za-z0-9]{6,8}$ ]]; then
            echo "A senha precisa ter de 6 a 8 letras ou numeros."
            exit 1
          fi
          echo "::add-mask::$VNC_PASSWORD"

          DIR="$HOME/virtual-pc"
          DISK="$DIR/bodhi.qcow2"
          ISO="$DIR/bodhi.iso"
          WALL="$DIR/extnobrasil-wallpaper.png"

          MONITOR="/tmp/bodhi-monitor.sock"
          QEMU_LOG="/tmp/bodhi-qemu.log"
          VNC_LOG="/tmp/bodhi-websockify.log"
          TUNNEL_LOG="/tmp/bodhi-cloudflared.log"

          QEMU_PID=""
          WEBSOCKIFY_PID=""
          CLOUDFLARED_PID=""

          cleanup() {
            EXIT_CODE=$?
            SAVE_OK=1

            trap - EXIT INT TERM
            set +e

            echo
            echo "===== EXT NOBRASIL: ENCERRANDO E SALVANDO ====="

            if [ -n "$QEMU_PID" ] &&
               kill -0 "$QEMU_PID" 2>/dev/null &&
               [ -S "$MONITOR" ]; then

              printf 'system_powerdown\n' |
                socat -T 5 - UNIX-CONNECT:"$MONITOR" \
                >/dev/null 2>&1

              for i in $(seq 1 30); do
                kill -0 "$QEMU_PID" 2>/dev/null || break
                sleep 1
              done

              if kill -0 "$QEMU_PID" 2>/dev/null; then
                printf 'quit\n' |
                  socat -T 5 - UNIX-CONNECT:"$MONITOR" \
                  >/dev/null 2>&1
              fi

              for i in $(seq 1 15); do
                kill -0 "$QEMU_PID" 2>/dev/null || break
                sleep 1
              done

              if kill -0 "$QEMU_PID" 2>/dev/null; then
                kill -TERM "$QEMU_PID" 2>/dev/null
                sleep 3
              fi

              if kill -0 "$QEMU_PID" 2>/dev/null; then
                kill -KILL "$QEMU_PID" 2>/dev/null
              fi

              wait "$QEMU_PID" 2>/dev/null
            fi

            # Tenta aplicar o papel de parede ao Bodhi instalado.
            # Se o disco ainda estiver vazio ou sem sistema instalado,
            # continua o salvamento sem interromper o workflow.
            if [ -s "$DISK" ]; then
              echo "Configurando papel de parede preto e vermelho..."

              if sudo virt-customize -a "$DISK" \
                --install feh \
                --mkdir /usr/share/backgrounds/extnobrasil \
                --upload "$WALL":/usr/share/backgrounds/extnobrasil/extnobrasil-wallpaper.png \
                --run-command \
                  "printf '%s\n' '#!/bin/sh' 'feh --no-fehbg --bg-fill /usr/share/backgrounds/extnobrasil/extnobrasil-wallpaper.png' > /usr/local/bin/extnobrasil-wallpaper.sh && chmod 755 /usr/local/bin/extnobrasil-wallpaper.sh" \
                --run-command \
                  "mkdir -p /etc/xdg/autostart && printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=ExtNoBrasil Wallpaper' 'Exec=/usr/local/bin/extnobrasil-wallpaper.sh' 'Terminal=false' 'X-GNOME-Autostart-enabled=true' > /etc/xdg/autostart/extnobrasil-wallpaper.desktop"; then
                echo "Papel de parede configurado."
              else
                echo "Aviso: nao foi possivel personalizar o disco nesta execucao."
                echo "Isso pode acontecer se o Bodhi ainda nao foi instalado."
              fi
            fi

            [ -n "$CLOUDFLARED_PID" ] && kill "$CLOUDFLARED_PID" 2>/dev/null
            [ -n "$WEBSOCKIFY_PID" ] && kill "$WEBSOCKIFY_PID" 2>/dev/null

            [ -n "$CLOUDFLARED_PID" ] && wait "$CLOUDFLARED_PID" 2>/dev/null
            [ -n "$WEBSOCKIFY_PID" ] && wait "$WEBSOCKIFY_PID" 2>/dev/null

            rm -f "$MONITOR"

            if [ ! -s "$DISK" ] || ! qemu-img check "$DISK"; then
              echo "ERRO: disco ausente ou com problemas."
              SAVE_OK=0
            else
              sync
              BACKUP="$DIR/bodhi-checkpoint.qcow2"
              PARTS="$DIR/checkpoint-parts"

              rm -rf "$PARTS"
              mkdir -p "$PARTS"
              rm -f "$BACKUP"

              echo "Compactando disco para o checkpoint..."
              if qemu-img convert -c -O qcow2 "$DISK" "$BACKUP"; then
                split -b 1800M -d -a 4 \
                  --additional-suffix=.part \
                  "$BACKUP" "$PARTS/bodhi-checkpoint-"

                rm -f "$BACKUP"

                shopt -s nullglob
                FILES=("$PARTS"/bodhi-checkpoint-*.part)

                if [ "${#FILES[@]}" -eq 0 ]; then
                  echo "ERRO: nenhuma parte do backup foi criada."
                  SAVE_OK=0
                else
                  TAG="bodhi-checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

                  if gh release create "$TAG" \
                    --repo "$GITHUB_REPOSITORY" \
                    --draft \
                    --title "Bodhi Checkpoint ${GITHUB_RUN_ID}" \
                    --notes "Checkpoint automatico ExtNoBrasil PC Gamer"; then

                    if gh release upload "$TAG" "${FILES[@]}" \
                      --repo "$GITHUB_REPOSITORY"; then

                      RELEASE_ID="$(gh api \
                        "repos/${GITHUB_REPOSITORY}/releases" \
                        --paginate \
                        --jq ".[] | select(.tag_name == \"$TAG\") | .id" |
                        head -n 1)"

                      if [ -n "$RELEASE_ID" ] &&
                        gh api \
                          "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                          -X PATCH -F draft=false >/dev/null; then
                        echo "Checkpoint publicado: $TAG"
                      else
                        echo "ERRO: nao foi possivel publicar o checkpoint."
                        SAVE_OK=0
                      fi
                    else
                      echo "ERRO: falha no upload das partes."
                      SAVE_OK=0
                    fi
                  else
                    echo "ERRO: falha ao criar a Release."
                    SAVE_OK=0
                  fi
                fi
              else
                echo "ERRO: falha ao compactar o disco."
                SAVE_OK=0
              fi

              rm -rf "$PARTS"
              rm -f "$BACKUP"
            fi

            if [ "$SAVE_OK" -eq 1 ]; then
              echo "Checkpoint salvo e verificado."
            else
              echo "ATENCAO: nao foi possivel confirmar o checkpoint."
              [ "$EXIT_CODE" -ne 0 ] || EXIT_CODE=1
            fi

            exit "$EXIT_CODE"
          }

          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=(-enable-kvm)
            CPU=host
            echo "Aceleracao KVM disponivel."
          else
            ACCEL=(-accel tcg,thread=multi)
            CPU=max
            echo "Aviso: emulacao por software, desempenho limitado."
          fi

          case "$BOOT_MODE" in
            installer) BOOT=(-boot order=d,menu=on) ;;
            disk)      BOOT=(-boot order=c,menu=on) ;;
            *)
              echo "Modo de boot invalido."
              exit 1
              ;;
          esac

          rm -f "$MONITOR" "$QEMU_LOG"

          qemu-system-x86_64 \
            "${ACCEL[@]}" \
            -machine pc \
            -cpu "$CPU" \
            -smp 2 \
            -m 4096 \
            -drive "file=$DISK,format=qcow2,if=ide" \
            -cdrom "$ISO" \
            "${BOOT[@]}" \
            -vga std \
            -usb \
            -device usb-tablet \
            -rtc base=utc \
            -display none \
            -vnc 127.0.0.1:1,password=on \
            -monitor unix:"$MONITOR",server,nowait \
            > "$QEMU_LOG" 2>&1 &

          QEMU_PID=$!

          for i in $(seq 1 40); do
            [ -S "$MONITOR" ] && break
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              cat "$QEMU_LOG"
              exit 1
            fi
            sleep 2
          done

          if [ ! -S "$MONITOR" ]; then
            echo "QEMU nao criou o monitor."
            cat "$QEMU_LOG"
            exit 1
          fi

          printf 'change vnc password %s\n' "$VNC_PASSWORD" |
            socat -T 5 - UNIX-CONNECT:"$MONITOR" \
            >/dev/null 2>&1 || true

          websockify --web=/usr/share/novnc \
            6080 127.0.0.1:5901 \
            > "$VNC_LOG" 2>&1 &
          WEBSOCKIFY_PID=$!

          sleep 3
          if ! kill -0 "$WEBSOCKIFY_PID" 2>/dev/null; then
            cat "$VNC_LOG"
            exit 1
          fi

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > "$TUNNEL_LOG" 2>&1 &
          CLOUDFLARED_PID=$!

          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              "$TUNNEL_LOG" | head -n 1 || true)"
            [ -n "$URL" ] && break
            kill -0 "$CLOUDFLARED_PID" 2>/dev/null || break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Nao foi possivel obter o link Cloudflare."
            cat "$TUNNEL_LOG"
            exit 1
          fi

          echo
          echo "========================================"
          echo " EXT NOBRASIL PC GAMER - BODHI LINUX"
          echo "========================================"
          echo "Visual: preto e vermelho"
          echo "Papel de parede: ExtNoBrasil PC Gamer"
          echo "Disco virtual: 145 GB"
          echo "RAM configurada: 4 GB"
          echo "Nucleos virtuais: 2"
          echo "Modo: $BOOT_MODE"
          echo "Acesso pelo celular:"
          echo "${URL}/vnc.html?autoconnect=true&resize=scale"
          echo "Senha VNC: a informada ao iniciar"
          echo "Checkpoint: GitHub Releases"
          echo "========================================"

          START=$SECONDS
          LIMIT=18000

          while kill -0 "$QEMU_PID" 2>/dev/null; do
            if (( SECONDS - START >= LIMIT )); then
              echo "Tempo de sessao atingido; encerrando para salvar."
              break
            fi
            sleep 5
          done

          echo "Finalizando a sessao."
          

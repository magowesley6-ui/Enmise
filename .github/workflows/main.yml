name: PC Virtual
on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "URL da ISO (só na 1ª vez)"
        default: ""
      minutes:
        description: "Minutos ligado (máx 340)"
        default: "330"

permissions:
  contents: read

jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils novnc websockify
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Restaurar disco
        uses: actions/cache/restore@v4
        with:
          path: disk.qcow2
          key: pcdisk-${{ github.run_id }}
          restore-keys: pcdisk-

      - name: Compilar launcher Rust
        run: |
          cat > pc.rs <<'EOF'
          use std::{env, io::{BufRead, BufReader, Write}, path::Path, process::{Command, Stdio}, thread, time::{Duration, Instant}};

          fn sh(c: &str, a: &[&str]) -> bool {
              Command::new(c).args(a).status().map(|s| s.success()).unwrap_or(false)
          }
          fn var(k: &str, d: &str) -> String {
              env::var(k).ok().filter(|v| !v.is_empty()).unwrap_or_else(|| d.to_string())
          }

          fn main() {
              let iso_url = var("ISO_URL", "");
              let ram = var("RAM", "6144");
              let cpus = var("CPUS", "4");
              let minutes: u64 = var("MINUTES", "330").parse().unwrap_or(330);
              let pass = var("VNC_PASS", "");
              let disk = "disk.qcow2";

              let first = !Path::new(disk).exists();
              if first {
                  sh("qemu-img", &["create", "-f", "qcow2", "-o", "lazy_refcounts=on", disk, "40G"]);
                  if !iso_url.is_empty() {
                      sh("curl", &["-L", "--fail", "-o", "os.iso", &iso_url]);
                  }
              }

              let mut args: Vec<String> = vec![
                  "-enable-kvm", "-cpu", "host", "-smp", &cpus, "-m", &ram,
                  "-drive", &format!("file={},if=virtio,cache=unsafe,aio=threads,discard=unmap", disk),
                  "-vga", "virtio", "-vnc", "127.0.0.1:1,password=on",
                  "-device", "virtio-net-pci,netdev=n0", "-netdev", "user,id=n0",
                  "-device", "qemu-xhci", "-device", "usb-tablet",
                  "-display", "none", "-monitor", "stdio",
              ].into_iter().map(String::from).collect();
              if first && Path::new("os.iso").exists() {
                  args.extend(["-cdrom", "os.iso", "-boot", "order=dc"].map(String::from));
              }

              let mut qemu = Command::new("qemu-system-x86_64")
                  .args(&args).stdin(Stdio::piped()).stdout(Stdio::null()).stderr(Stdio::null())
                  .spawn().expect("qemu falhou");
              let mut mon = qemu.stdin.take().unwrap();
              thread::sleep(Duration::from_secs(2));
              if !pass.is_empty() {
                  let _ = writeln!(mon, "set_password vnc {}", pass);
              }

              let _ws = Command::new("websockify")
                  .args(["--web", "/usr/share/novnc", "6080", "127.0.0.1:5901"])
                  .stdout(Stdio::null()).stderr(Stdio::null()).spawn().expect("websockify falhou");

              let mut cf = Command::new("./cloudflared")
                  .args(["tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:6080"])
                  .stdout(Stdio::null()).stderr(Stdio::piped()).spawn().expect("cloudflared falhou");
              let err = cf.stderr.take().unwrap();
              thread::spawn(move || {
                  for l in BufReader::new(err).lines().flatten() {
                      if let Some(i) = l.find("https://") {
                          let u = l[i..].split_whitespace().next().unwrap_or("");
                          if u.contains("trycloudflare.com") {
                              println!("\n>>> ACESSE: {}/vnc.html\n", u);
                              if let Ok(p) = env::var("GITHUB_STEP_SUMMARY") {
                                  let _ = std::fs::write(p, format!("### PC Virtual\n{}/vnc.html\n", u));
                              }
                          }
                      }
                  }
              });

              let fim = Instant::now() + Duration::from_secs(minutes * 60);
              while Instant::now() < fim {
                  if let Ok(Some(_)) = qemu.try_wait() { break; }
                  thread::sleep(Duration::from_secs(5));
              }

              // desligamento limpo pra não corromper o disco
              let _ = writeln!(mon, "system_powerdown");
              for _ in 0..30 {
                  if let Ok(Some(_)) = qemu.try_wait() { return; }
                  thread::sleep(Duration::from_secs(2));
              }
              let _ = writeln!(mon, "quit");
              let _ = qemu.wait();
          }
          EOF
          rustc -C opt-level=3 -C panic=abort -C strip=symbols pc.rs -o pc

      - name: Rodar PC
        env:
          ISO_URL: ${{ inputs.iso_url }}
          MINUTES: ${{ inputs.minutes }}
          VNC_PASS: ${{ secrets.VNC_PASS }}
        run: ./pc

      - name: Salvar disco
        if: always()
        uses: actions/cache/save@v4
        with:
          path: disk.qcow2
          key: pcdisk-${{ github.run_id }}

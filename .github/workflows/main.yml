
name: ExtNoBrasil PC Gamer - Windows 11 Dark

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: "Link direto para a ISO oficial do Windows 11 x64"
        required: true
        type: string
      vnc_password:
        description: "Senha VNC: 6 a 8 letras ou números"
        required: true
        type: string
      boot_mode:
        description: "Escolha installer na primeira execução"
        required: true
        type: choice
        default: installer
        options:
          - installer
          - disk

permissions:
  contents: write

concurrency:
  group: extnobrasil-windows11
  cancel-in-progress: false

jobs:
  virtual-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils ovmf \
            novnc websockify socat curl wget \
            ca-certificates openssh-client gh

          mkdir -p "$HOME/virtual-pc"

      - name: Restaurar checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/virtual-pc"

          TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            --jq '[.[] |
              select(.isDraft == false) |
              select(.tagName | startswith("win11-checkpoint-"))] |
              sort_by(.publishedAt) | last | .tagName // empty')"

          if [ -n "$TAG" ]; then
            mkdir -p parts
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'win11-checkpoint-*.part' \
              --dir parts

            shopt -s nullglob
            FILES=(parts/win11-checkpoint-*.part)
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "Checkpoint sem arquivos."
              exit 1
            fi

            cat "${FILES[@]}" > restored.qcow2
            qemu-img check restored.qcow2
            mv restored.qcow2 windows11.qcow2
            rm -rf parts
            echo "Disco restaurado."
          else
            echo "Nenhum checkpoint anterior encontrado."
          fi

      - name: Baixar ISO e preparar disco
        env:
          WINDOWS_ISO_URL: ${{ inputs.windows_iso_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/virtual-pc"

          if [ ! -s windows11.qcow2 ]; then
            qemu-img create -f qcow2 windows11.qcow2 145G
          fi

          if [ ! -s windows11.iso ]; then
            case "$WINDOWS_ISO_URL" in
              https://*) ;;
              *)
                echo "Use um link HTTPS direto para a ISO."
                exit 1
                ;;
            esac

            curl -fL --retry 3 \
              "$WINDOWS_ISO_URL" \
              -o windows11.iso
          fi

          test -s windows11.iso
          qemu-img info windows11.qcow2
          ls -lh windows11.iso

      - name: Iniciar Windows 11 e acessos remotos
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
          BOOT_MODE: ${{ inputs.boot_mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/virtual-pc"

          if [[ ! "$VNC_PASSWORD" =~ ^[A-Za-z0-9]{6,8}$ ]]; then
            echo "A senha deve ter de 6 a 8 letras ou números."
            exit 1
          fi
          echo "::add-mask::$VNC_PASSWORD"

          MON=/tmp/win11-monitor.sock
          QLOG=/tmp/win11-qemu.log
          BLOG=/tmp/win11-websockify.log
          CLOG=/tmp/win11-cloudflare.log
          PLOG=/tmp/win11-pinggy.log

          QPID=""
          WPID=""
          CPID=""
          TPID=""

          cleanup() {
            RC=$?
            trap - EXIT INT TERM
            set +e

            echo "Encerrando a máquina virtual..."

            if [ -S "$MON" ]; then
              printf 'system_powerdown\n' |
                socat -T 5 - UNIX-CONNECT:"$MON" >/dev/null 2>&1
            fi

            if [ -n "$QPID" ] && kill -0 "$QPID" 2>/dev/null; then
              sleep 5
              printf 'quit\n' |
                socat -T 5 - UNIX-CONNECT:"$MON" >/dev/null 2>&1
              sleep 2
              kill "$QPID" 2>/dev/null
              wait "$QPID" 2>/dev/null
            fi

            for PID in "$TPID" "$CPID" "$WPID"; do
              [ -n "$PID" ] && kill "$PID" 2>/dev/null
            done

            if [ -s windows11.qcow2 ] &&
               qemu-img check windows11.qcow2; then
              echo "Criando checkpoint do disco..."
              if qemu-img convert -c -O qcow2 \
                windows11.qcow2 checkpoint.qcow2; then
                mkdir -p checkpoint-parts
                split -b 1800M -d -a 4 \
                  --additional-suffix=.part \
                  checkpoint.qcow2 \
                  checkpoint-parts/win11-checkpoint-

                shopt -s nullglob
                FILES=(checkpoint-parts/win11-checkpoint-*.part)

                if [ "${#FILES[@]}" -gt 0 ]; then
                  TAG="win11-checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

                  gh release create "$TAG" "${FILES[@]}" \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "Windows 11 Checkpoint ${GITHUB_RUN_ID}" \
                    --notes "Checkpoint do ExtNoBrasil PC Gamer" ||
                    RC=1
                else
                  echo "Nenhuma parte do checkpoint foi criada."
                  RC=1
                fi

                rm -rf checkpoint-parts checkpoint.qcow2
              else
                echo "Falha ao compactar o disco."
                RC=1
              fi
            else
              echo "Disco inválido; checkpoint ignorado."
              RC=1
            fi

            exit "$RC"
          }

          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # KVM oferece aceleração de CPU quando disponível.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=(-enable-kvm)
            CPU=host
            echo "Aceleração KVM disponível."
          else
            ACCEL=(-accel tcg,thread=multi)
            CPU=max
            echo "AVISO: sem KVM; o Windows pode ficar muito lento."
          fi

          if [ "$BOOT_MODE" = "installer" ]; then
            BOOT=(-boot order=d,menu=on)
          else
            BOOT=(-boot order=c,menu=on)
          fi

          # Firmware UEFI para inicialização do Windows.
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd

          if [ ! -f "$OVMF_CODE" ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
            OVMF_VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS.fd
          fi

          if [ ! -f "$OVMF_CODE" ] ||
             [ ! -f "$OVMF_VARS_TEMPLATE" ]; then
            echo "Firmware OVMF não encontrado."
            exit 1
          fi

          if [ ! -s windows11-vars.fd ]; then
            cp "$OVMF_VARS_TEMPLATE" windows11-vars.fd
          fi

          rm -f "$MON" "$QLOG"

          qemu-system-x86_64 \
            "${ACCEL[@]}" \
            -machine q35 \
            -cpu "$CPU" \
            -smp 4 \
            -m 6144 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=windows11-vars.fd \
            -drive file=windows11.qcow2,format=qcow2,if=ide \
            -drive file=windows11.iso,media=cdrom,readonly=on \
            "${BOOT[@]}" \
            -vga std \
            -usb -device usb-tablet \
            -rtc base=utc \
            -display none \
            -vnc 127.0.0.1:1,password=on \
            -monitor unix:"$MON",server,nowait \
            > "$QLOG" 2>&1 &

          QPID=$!

          for i in $(seq 1 30); do
            [ -S "$MON" ] && break
            kill -0 "$QPID" 2>/dev/null || {
              cat "$QLOG"
              exit 1
            }
            sleep 2
          done

          [ -S "$MON" ] || {
            cat "$QLOG"
            exit 1
          }

          printf 'change vnc password %s\n' "$VNC_PASSWORD" |
            socat -T 5 - UNIX-CONNECT:"$MON" >/dev/null 2>&1 || true

          websockify --web=/usr/share/novnc \
            6080 127.0.0.1:5901 > "$BLOG" 2>&1 &
          WPID=$!

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate > "$CLOG" 2>&1 &
          CPID=$!

          WEB_URL=""
          for i in $(seq 1 60); do
            WEB_URL="$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              "$CLOG" | head -n 1 || true)"
            [ -n "$WEB_URL" ] && break
            sleep 2
          done

          ssh -p 443 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -R0:localhost:5901 \
            tcp@a.pinggy.io > "$PLOG" 2>&1 &
          TPID=$!

          TCP_URL=""
          for i in $(seq 1 60); do
            TCP_URL="$(grep -Eo \
              'tcp://[^[:space:]]+' "$PLOG" | head -n 1 || true)"
            [ -n "$TCP_URL" ] && break
            sleep 2
          done

          echo
          echo "=========================================="
          echo " EXT NOBRASIL PC GAMER - WINDOWS 11"
          echo "=========================================="
          echo "RAM configurada: 6 GB"
          echo "CPU virtual: 4 vCPU"
          echo "Disco virtual máximo: 145 GB"
          echo "Modo: $BOOT_MODE"
          echo "noVNC: ${WEB_URL}/vnc.html?autoconnect=true&resize=scale"
          echo "Tema Dark e debloat: não aplicados automaticamente."
          echo "Instale o Windows e configure-o após a instalação."

          if [ -n "$TCP_URL" ]; then
            echo "Endereço bVNC: $TCP_URL"
            echo "No bVNC, separe host e porta do endereço."
          else
            echo "Túnel bVNC indisponível nesta execução."
            cat "$PLOG"
          fi

          echo "Senha VNC: a senha informada ao iniciar."
          echo "Mantenha esta execução ativa."
          echo "FPS do Roblox Studio não garantidos."
          echo "=========================================="

          START=$SECONDS
          while kill -0 "$QPID" 2>/dev/null; do
            if (( SECONDS - START >= 18000 )); then
              echo "Limite de sessão atingido."
              break
            fi
            sleep 5
          done
          

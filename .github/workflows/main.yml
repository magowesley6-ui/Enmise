name: ExtNoBrasil PC Gamer - Garuda KDE Performance

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha do bVNC: 6 a 8 letras ou números"
        required: true
        type: string
      boot_mode:
        description: "Modo de inicialização"
        required: true
        type: choice
        options:
          - installer
          - disk
        default: installer

permissions:
  contents: read
  actions: write

concurrency:
  group: extnobrasil-pc-gamer
  cancel-in-progress: false

jobs:
  virtual-pc:
    name: ExtNoBrasil PC Virtual
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BOOT_MODE: ${{ inputs.boot_mode }}
      VNC_PASSWORD: ${{ inputs.vnc_password }}

    steps:
      - name: Instalar ferramentas
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            zstd \
            socat \
            curl \
            wget \
            openssh-client \
            python3

      - name: Preparar pastas
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/garuda" "$HOME/garuda-save"

      - name: Restaurar checkpoint
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/garuda-save/garuda.qcow2.zst
          key: garuda-extnobrasil-latest
          restore-keys: |
            garuda-extnobrasil-

      - name: Preparar disco e ISO
        shell: bash
        run: |
          set -Eeuo pipefail

          DISK="$HOME/garuda/garuda.qcow2"
          ISO="$HOME/garuda/garuda.iso"
          SAVE="$HOME/garuda-save/garuda.qcow2.zst"

          if [ -s "$SAVE" ]; then
            echo "Restaurando checkpoint..."
            zstd -d -f "$SAVE" -o "$DISK"
            echo "RESTORED=sim" >> "$GITHUB_ENV"
          else
            echo "Criando disco virtual de 80 GB..."
            qemu-img create -f qcow2 "$DISK" 80G
            echo "RESTORED=não" >> "$GITHUB_ENV"
          fi

          if [ ! -s "$ISO" ]; then
            wget -O "$ISO" \
              "https://sourceforge.net/projects/garuda-linux/files/garuda/dr460nized/260819/garuda-dr460nized-linux-garuda-260819.iso/download"
          fi

          qemu-img info "$DISK"

      - name: Ajustar CPU e RAM
        shell: bash
        run: |
          set -Eeuo pipefail

          # Usa no máximo 4 vCPUs.
          HOST_CPUS="$(nproc)"
          CPU_COUNT="$HOST_CPUS"
          if [ "$CPU_COUNT" -gt 4 ]; then
            CPU_COUNT=4
          fi
          if [ "$CPU_COUNT" -lt 2 ]; then
            CPU_COUNT=2
          fi

          # Deixa memória para o runner e para o túnel.
          AVAILABLE_MB="$(awk '/MemAvailable:/ {
            printf "%d", $2 / 1024
          }' /proc/meminfo)"

          RAM_MB=$((AVAILABLE_MB - 2048))
          if [ "$RAM_MB" -gt 6144 ]; then
            RAM_MB=6144
          fi
          if [ "$RAM_MB" -gt 4096 ]; then
            RAM_MB=4096
          fi
          if [ "$RAM_MB" -lt 2048 ]; then
            RAM_MB=2048
          fi

          echo "CPU_COUNT=$CPU_COUNT" >> "$GITHUB_ENV"
          echo "RAM_MB=$RAM_MB" >> "$GITHUB_ENV"

          echo "CPUs virtuais: $CPU_COUNT"
          echo "RAM virtual: $RAM_MB MB"

      - name: Detectar KVM
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ACCEL=kvm" >> "$GITHUB_ENV"
            echo "CPU_MODEL=host" >> "$GITHUB_ENV"
            echo "KVM disponível."
          else
            echo "ACCEL=tcg,thread=multi" >> "$GITHUB_ENV"
            echo "CPU_MODEL=max" >> "$GITHUB_ENV"
            echo "KVM indisponível: usando emulação por software."
          fi

      - name: Iniciar QEMU com VirtIO-GPU experimental
        shell: bash
        run: |
          set -Eeuo pipefail

          DISK="$HOME/garuda/garuda.qcow2"
          ISO="$HOME/garuda/garuda.iso"
          MONITOR="$HOME/garuda/monitor.sock"
          LOG="$HOME/garuda/qemu.log"

          rm -f "$MONITOR"

          if [ "${#VNC_PASSWORD}" -lt 6 ] ||
             [ "${#VNC_PASSWORD}" -gt 8 ] ||
             [[ ! "$VNC_PASSWORD" =~ ^[a-zA-Z0-9]+$ ]]; then
            echo "ERRO: a senha deve ter de 6 a 8 letras ou números."
            exit 1
          fi

          BOOT_ARGS=()
          if [ "$BOOT_MODE" = "installer" ]; then
            BOOT_ARGS=(-cdrom "$ISO" -boot order=d)
          else
            BOOT_ARGS=(-boot order=c)
          fi

          echo "Modo: $BOOT_MODE"
          echo "RAM: ${RAM_MB} MB"
          echo "CPUs: $CPU_COUNT"
          echo "Aceleração: $ACCEL"
          echo "Vídeo: VirtIO-GPU experimental"
          echo "Checkpoint restaurado: $RESTORED"

          qemu-system-x86_64 \
            -name "ExtNoBrasil PC Gamer" \
            -machine pc \
            -accel "$ACCEL" \
            -cpu "$CPU_MODEL" \
            -smp "$CPU_COUNT" \
            -m "$RAM_MB" \
            -vga virtio \
            -display none \
            -drive file="$DISK",format=qcow2,if=ide \
            "${BOOT_ARGS[@]}" \
            -device qemu-xhci,id=usb \
            -device usb-tablet,bus=usb.0 \
            -netdev user,id=net0 \
            -device e1000,netdev=net0 \
            -vnc 127.0.0.1:0,password=on \
            -monitor unix:"$MONITOR",server,nowait \
            -no-reboot \
            > "$LOG" 2>&1 &

          QEMU_PID=$!
          echo "$QEMU_PID" > "$HOME/garuda/qemu.pid"

          READY=false
          for i in $(seq 1 60); do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "ERRO: QEMU encerrou durante a inicialização."
              cat "$LOG" || true
              exit 1
            fi

            if [ -S "$MONITOR" ]; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "ERRO: monitor do QEMU não ficou disponível."
            cat "$LOG" || true
            exit 1
          fi

          export MONITOR VNC_PASSWORD

          python3 <<'PY'
          import os, socket, time, sys

          path = os.environ["MONITOR"]
          password = os.environ["VNC_PASSWORD"]
          s = None

          for _ in range(60):
              try:
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.settimeout(3)
                  s.connect(path)
                  break
              except OSError:
                  if s:
                      s.close()
                  s = None
                  time.sleep(1)

          if s is None:
              print("ERRO: não conectou ao monitor QEMU.")
              sys.exit(1)

          def read_until(markers, timeout=5):
              s.settimeout(timeout)
              data = b""
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  try:
                      chunk = s.recv(4096)
                      if not chunk:
                          break
                      data += chunk
                      low = data.lower()
                      if any(m in low for m in markers):
                          break
                  except socket.timeout:
                      break
              return data

          try:
              read_until([b"(qemu)"])
              s.sendall(b"change vnc password\n")
              response = read_until([b"password:"])

              if b"password:" not in response.lower():
                  print("ERRO: o monitor não solicitou a senha VNC.")
                  print(response.decode(errors="replace"))
                  sys.exit(1)

              s.sendall(password.encode() + b"\n")
              print("Comando de senha VNC enviado.")
              print(read_until([b"(qemu)"]).decode(errors="replace"))
          finally:
              s.close()
          PY

      - name: Abrir túnel TCP para bVNC
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$HOME/garuda/tunnel.log"

          # Túnel TCP direto para o servidor VNC local na porta 5900.
          # Não é um link web noVNC.
          ssh -T \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -p 443 \
            -R 0:127.0.0.1:5900 \
            tcp@a.pinggy.io \
            2>&1 | tee "$LOG" &
          echo $! > "$HOME/garuda/tunnel.pid"

          sleep 10

          echo
          echo "=============================================="
          echo " DETALHES DO PC VIRTUAL [BETA]"
          echo " Criador - ExtNoBrasil (ExT)"
          echo " Perfil do Discord - Brasil_kill0"
          echo "=============================================="

          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path.home() / "garuda" / "tunnel.log"
          content = path.read_text(errors="replace")

          # Tenta extrair host e porta publicados pelo Pinggy.
          patterns = [
              r'tcp://([a-zA-Z0-9.-]+):([0-9]{2,5})',
              r'([a-zA-Z0-9.-]+\.pinggy\.io):([0-9]{2,5})',
          ]

          found = None
          for pattern in patterns:
              for host, port in re.findall(pattern, content):
                  if host in ("127.0.0.1", "localhost"):
                      continue
                  if port in ("22", "443", "5900", "6080"):
                      continue
                  found = (host, port)
                  break
              if found:
                  break

          if found:
              print("Endereço de Servidor:")
              print(found[0])
              print()
              print("Porta:")
              print(found[1])
          else:
              print("Endereço de Servidor:")
              print("Não identificado automaticamente; veja o log abaixo.")
              print()
              print("Porta:")
              print("Não identificada automaticamente; veja o log abaixo.")

          print()
          print("Senha: a senha VNC configurada no workflow.")
          print("==============================================")
          print()
          print("LOG DO TÚNEL:")
          print(content[-5000:])
          PY

      - name: Manter sessão ativa
        shell: bash
        run: |
          set -Eeuo pipefail
          QEMU_PID="$(cat "$HOME/garuda/qemu.pid")"

          while kill -0 "$QEMU_PID" 2>/dev/null; do
            sleep 15
          done

          echo "QEMU encerrou."

      - name: Encerrar e compactar checkpoint
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          MONITOR="$HOME/garuda/monitor.sock"
          DISK="$HOME/garuda/garuda.qcow2"
          SAVE="$HOME/garuda-save/garuda.qcow2.zst"

          if [ -S "$MONITOR" ]; then
            printf 'quit\n' |
              socat - UNIX-CONNECT:"$MONITOR" >/dev/null 2>&1 || true
          fi

          for file in qemu.pid tunnel.pid; do
            if [ -f "$HOME/garuda/$file" ]; then
              kill "$(cat "$HOME/garuda/$file")" 2>/dev/null || true
            fi
          done

          sleep 3

          if [ ! -s "$DISK" ]; then
            echo "Disco não encontrado. Nada para salvar."
            exit 0
          fi

          echo "Compactando disco..."
          zstd -T0 -1 -f "$DISK" -o "$SAVE"

          SIZE="$(stat -c%s "$SAVE")"
          MAX_SIZE=$((9800 * 1024 * 1024))

          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Checkpoint maior que 9,8 GB; não será salvo no cache."
            rm -f "$SAVE"
            exit 0
          fi

          echo "SAVE_READY=true" >> "$GITHUB_ENV"
          echo "Checkpoint pronto: $SIZE bytes"

      - name: Salvar checkpoint no cache
        if: always() && env.SAVE_READY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/garuda-save/garuda.qcow2.zst
          key: garuda-extnobrasil-${{ github.run_id }}-${{ github.run_attempt }}


name: ExtNoBrasil PC Gamer - bVNC

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Senha que você vai usar no bVNC"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pc-virtual:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configurar acesso remoto
        shell: powershell
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RDP_PASSWORD.Length -lt 12) {
            throw "A senha precisa ter pelo menos 12 caracteres."
          }

          if ($env:RDP_PASSWORD -notmatch '[A-Z]' -or
              $env:RDP_PASSWORD -notmatch '[a-z]' -or
              $env:RDP_PASSWORD -notmatch '\d' -or
              $env:RDP_PASSWORD -notmatch '[^a-zA-Z0-9]') {
            throw "Use letras maiúsculas, minúsculas, números e símbolos na senha."
          }

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          # Ativar Área de Trabalho Remota
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          # Manter a autenticação de nível de rede ativada
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          # Criar usuário local
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name 'Skyro' -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name 'Skyro' -Password $securePassword
          } else {
            New-LocalUser -Name 'Skyro' `
              -Password $securePassword `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group 'Administrators' `
            -Member 'Skyro' -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group 'Remote Desktop Users' `
            -Member 'Skyro' -ErrorAction SilentlyContinue

          # Liberar RDP no firewall do Windows
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # Confirmar que a porta local está escutando
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $test = Test-NetConnection 127.0.0.1 `
              -Port 3389 -WarningAction SilentlyContinue
            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            throw "O RDP não abriu a porta local 3389."
          }

          # Verificar cliente SSH
          $ssh = Get-Command ssh.exe -ErrorAction SilentlyContinue
          if (-not $ssh) {
            Add-WindowsCapability -Online `
              -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null
            $ssh = Get-Command ssh.exe -ErrorAction SilentlyContinue
          }

          if (-not $ssh) {
            throw "Não foi possível instalar o cliente SSH."
          }

          # Iniciar túnel TCP temporário
          $outFile = Join-Path $env:TEMP 'pinggy-out.txt'
          $errFile = Join-Path $env:TEMP 'pinggy-err.txt'
          Remove-Item $outFile,$errFile -Force `
            -ErrorAction SilentlyContinue

          $sshArgs = @(
            '-T'
            '-o', 'StrictHostKeyChecking=no'
            '-o', 'ServerAliveInterval=30'
            '-o', 'ServerAliveCountMax=3'
            '-p', '443'
            '-R', '0:localhost:3389'
            'tcp@a.pinggy.io'
          )

          $tunnel = Start-Process `
            -FilePath $ssh.Source `
            -ArgumentList $sshArgs `
            -PassThru `
            -RedirectStandardOutput $outFile `
            -RedirectStandardError $errFile

          $server = $null
          $port = $null

          # Aguardar o endereço real fornecido pelo túnel
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2

            if ($tunnel.HasExited) {
              break
            }

            $log = ''
            if (Test-Path $outFile) {
              $log += Get-Content $outFile -Raw `
                -ErrorAction SilentlyContinue
            }
            if (Test-Path $errFile) {
              $log += Get-Content $errFile -Raw `
                -ErrorAction SilentlyContinue
            }

            $match = [regex]::Match(
              $log,
              'tcp://([a-zA-Z0-9.-]+):(\d+)'
            )

            if ($match.Success) {
              $server = $match.Groups[1].Value
              $port = $match.Groups[2].Value
              break
            }
          }

          if (-not $server -or -not $port) {
            Stop-Process -Id $tunnel.Id -Force `
              -ErrorAction SilentlyContinue
            throw "O túnel não forneceu servidor e porta. Consulte o erro do SSH."
          }

          # Mostrar somente os dois campos solicitados
          Write-Output ""
          Write-Output "Servidor: $server"
          Write-Output "Porta: $port"

          # Manter a sessão ativa enquanto o túnel estiver conectado
          while (-not $tunnel.HasExited) {
            Start-Sleep -Seconds 15
            $tunnel.Refresh()
          }

          throw "A conexão do túnel foi encerrada."
          


name: ExtNoBrasil PC - Garuda Linux (bVNC + Salvamento)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC (ate 8 caracteres)"
        required: true
        type: string
      edition:
        description: "Edicao do Garuda Linux"
        type: choice
        options:
          - mokka
          - xfce
          - kde-lite
          - dr460nized
          - gnome
          - cinnamon
          - dr460nized-gaming
        default: xfce
      fresh_install:
        description: "Comecar do zero?"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  garuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      DISK: 80G
      ISO_URL: https://iso.builds.garudalinux.org/iso/latest/garuda/${{ inputs.edition }}/latest.iso
      VNC_PASS: ${{ inputs.vnc_password }}
      MAX_SECONDS: 19500

    steps:
      - name: Instalar pacotes
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          if [ -z "$VNC_PASS" ] || [ "${#VNC_PASS}" -gt 8 ]; then
            echo "ERRO: a senha VNC deve ter entre 1 e 8 caracteres."
            exit 1
          fi
          echo "::add-mask::$VNC_PASS"

          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

          sudo apt-get update -qq
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils curl wget ca-certificates \
            zstd socat aria2 openssh-client netcat-openbsd

      - name: Restaurar disco anterior
        id: restore
        if: ${{ !inputs.fresh_install }}
        uses: actions/cache/restore@v4
        with:
          path: ~/garuda-save
          key: garuda-bvnc-none-${{ github.run_id }}
          restore-keys: |
            garuda-bvnc-

      - name: Preparar ISO e disco
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/garuda" "$HOME/garuda-save"

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

          if [ -w /dev/kvm ]; then
            echo "ACCEL=kvm" >> "$GITHUB_ENV"
            echo "CPU_OPT=host" >> "$GITHUB_ENV"
            echo "KVM disponivel."
          else
            echo "ACCEL=tcg,thread=multi" >> "$GITHUB_ENV"
            echo "CPU_OPT=max" >> "$GITHUB_ENV"
            echo "AVISO: sem KVM, o Garuda ficara muito lento."
          fi

          aria2c -x 4 -s 4 -k 1M \
            --console-log-level=warn \
            -d "$HOME/garuda" -o garuda.iso "$ISO_URL" \
            || wget -O "$HOME/garuda/garuda.iso" "$ISO_URL"

          SIZE=$(stat -c%s "$HOME/garuda/garuda.iso")
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERRO: ISO incompleta ou URL invalida ($SIZE bytes)."
            exit 1
          fi

          ZST="$HOME/garuda-save/garuda.qcow2.zst"
          SZ_FILE="$HOME/garuda-save/garuda.size"
          RESTORE_OK=false

          if [ -f "$ZST" ] && [ -f "$SZ_FILE" ]; then
            NEED=$(cat "$SZ_FILE")
            AVAIL=$(df --output=avail -B1 / | tail -1)
            if [ "$NEED" -lt "$((AVAIL - 12000000000))" ]; then
              RESTORE_OK=true
            fi
          fi

          if [ "$RESTORE_OK" = true ]; then
            echo "Restaurando disco salvo..."
            zstd -d -f "$ZST" -o "$HOME/garuda/garuda.qcow2"
            echo "RESTORED=true" >> "$GITHUB_ENV"
          else
            echo "Criando disco novo."
            rm -f "$HOME/garuda-save/garuda.qcow2.zst" \
                  "$HOME/garuda-save/garuda.size"
            qemu-img create -f qcow2 \
              "$HOME/garuda/garuda.qcow2" "$DISK"
            echo "RESTORED=false" >> "$GITHUB_ENV"
          fi

          sudo fallocate -l 4G /swapfile-extra || true
          sudo chmod 600 /swapfile-extra || true
          sudo mkswap /swapfile-extra >/dev/null 2>&1 || true
          sudo swapon /swapfile-extra || true

      - name: Criar inicializador QEMU
        shell: bash
        run: |
          set -euo pipefail

          AVAIL_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          VM_RAM_MB=$((AVAIL_MB - 1500))
          [ "$VM_RAM_MB" -gt 10000 ] && VM_RAM_MB=10000
          [ "$VM_RAM_MB" -lt 1536 ] && VM_RAM_MB=1536

          VM_CPUS=$(nproc)
          echo "VM_RAM_MB=$VM_RAM_MB" >> "$GITHUB_ENV"
          echo "VM_CPUS=$VM_CPUS" >> "$GITHUB_ENV"

          cat > "$HOME/garuda/start.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -e
          exec qemu-system-x86_64 \
            -machine q35 \
            -accel "${ACCEL}" \
            -cpu "${CPU_OPT}" \
            -smp "${VM_CPUS}" \
            -m "${VM_RAM_MB}M" \
            -drive file="${HOME}/garuda/garuda.qcow2",if=virtio,format=qcow2,cache=writeback \
            -cdrom "${HOME}/garuda/garuda.iso" \
            -boot order=cd \
            -vga std \
            -device qemu-xhci \
            -device usb-tablet \
            -vnc "127.0.0.1:0,password=on" \
            -monitor unix:"${HOME}/garuda/monitor.sock",server,nowait \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0
          SCRIPT

          chmod +x "$HOME/garuda/start.sh"

      - name: Iniciar Garuda
        shell: bash
        env:
          ACCEL: ${{ env.ACCEL }}
          CPU_OPT: ${{ env.CPU_OPT }}
          VM_RAM_MB: ${{ env.VM_RAM_MB }}
          VM_CPUS: ${{ env.VM_CPUS }}
          VNC_PASS: ${{ inputs.vnc_password }}
        run: |
          set -euo pipefail

          # O QEMU exige autenticação VNC configurada no monitor.
          nohup "$HOME/garuda/start.sh" \
            > "$HOME/garuda/qemu.log" 2>&1 &
          echo "VM_STARTED=true" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            sleep 2
            if ss -ltn | grep -q '127.0.0.1:5900'; then
              break
            fi
          done

          if ! pgrep -f '[q]emu-system-x86_64' >/dev/null; then
            cat "$HOME/garuda/qemu.log"
            echo "ERRO: QEMU nao iniciou."
            exit 1
          fi

          # Configurar a senha VNC pelo monitor QEMU.
          python3 - "$VNC_PASS" <<'PY'
          import socket, sys, time
          path = __import__('os').path.expanduser('~/garuda/monitor.sock')
          password = sys.argv[1]
          for _ in range(30):
              try:
                  s = socket.socket(socket.AF_UNIX)
                  s.connect(path)
                  s.recv(4096)
                  s.sendall(b"change vnc password\n")
                  time.sleep(0.5)
                  s.recv(4096)
                  s.sendall((password + "\n").encode())
                  time.sleep(0.5)
                  s.close()
                  print("Comando de senha enviado ao monitor.")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("ERRO: nao consegui configurar a senha VNC.")
          PY

      - name: Criar tunel TCP para bVNC
        shell: bash
        run: |
          set -euo pipefail

          # O Pinggy precisa aceitar encaminhamento TCP remoto.
          # O formato do endereço pode variar conforme o serviço.
          nohup ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -p 443 -R 0:127.0.0.1:5900 \
            tcp@a.pinggy.io \
            > "$HOME/garuda/pinggy.log" 2>&1 &

          echo $! > "$HOME/garuda/tunnel.pid"

          SERVER=""
          PORT=""

          for i in $(seq 1 60); do
            sleep 2
            if [ -f "$HOME/garuda/pinggy.log" ]; then
              MATCH=$(grep -oE 'tcp://[^[:space:]]+:[0-9]+' \
                "$HOME/garuda/pinggy.log" | tail -1 || true)
              if [ -n "$MATCH" ]; then
                SERVER=$(printf '%s' "$MATCH" | sed -E 's#tcp://([^:]+):.*#\1#')
                PORT=$(printf '%s' "$MATCH" | sed -E 's#.*:([0-9]+)$#\1#')
                break
              fi
            fi
            if ! kill -0 "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null; then
              break
            fi
          done

          if [ -z "$SERVER" ] || [ -z "$PORT" ]; then
            echo "ERRO: o Pinggy nao forneceu servidor e porta."
            cat "$HOME/garuda/pinggy.log" || true
            exit 1
          fi

          echo "SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "PORT=$PORT" >> "$GITHUB_ENV"

          echo "=============================="
          echo "Servidor: $SERVER"
          echo "Porta: $PORT"
          echo "=============================="

      - name: Manter sessão ativa
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            NOW=$(date +%s)
            if [ "$((NOW - START_TS))" -ge "$MAX_SECONDS" ]; then
              echo "Limite da sessao atingido."
              break
            fi
            if ! pgrep -f '[q]emu-system-x86_64' >/dev/null; then
              echo "VM encerrada."
              break
            fi
            if ! kill -0 "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null; then
              echo "Tunel desconectado."
              break
            fi
            sleep 30
          done

      - name: Encerrar VM
        if: always()
        shell: bash
        run: |
          if [ -S "$HOME/garuda/monitor.sock" ]; then
            echo system_powerdown | socat - UNIX-CONNECT:"$HOME/garuda/monitor.sock" || true
            sleep 10
            echo quit | socat - UNIX-CONNECT:"$HOME/garuda/monitor.sock" || true
          fi
          if [ -f "$HOME/garuda/tunnel.pid" ]; then
            kill "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null || true
          fi

      - name: Compactar disco para salvamento
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if pgrep -f '[q]emu-system-x86_64' >/dev/null; then
            echo "QEMU ainda ativo; nao vou salvar o disco."
            exit 0
          fi

          if [ ! -f "$HOME/garuda/garuda.qcow2" ]; then
            echo "Disco nao encontrado."
            exit 0
          fi

          mkdir -p "$HOME/garuda-save"
          qemu-img convert -f qcow2 -O qcow2 \
            "$HOME/garuda/garuda.qcow2" \
            "$HOME/garuda-save/garuda-compact.qcow2"

          zstd -T0 -1 -f \
            "$HOME/garuda-save/garuda-compact.qcow2" \
            -o "$HOME/garuda-save/garuda.qcow2.zst"

          stat -c%s "$HOME/garuda-save/garuda-compact.qcow2" \
            > "$HOME/garuda-save/garuda.size"

          rm -f "$HOME/garuda-save/garuda-compact.qcow2"

          SIZE=$(stat -c%s "$HOME/garuda-save/garuda.qcow2.zst")
          if [ "$SIZE" -gt 9800000000 ]; then
            echo "Save maior que o limite aproximado do cache."
            exit 0
          fi

          echo "SAVE_READY=true" >> "$GITHUB_ENV"

      - name: Salvar disco no cache
        if: always() && env.SAVE_READY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/garuda-save
          key: garuda-bvnc-${{ github.run_id }}-${{ github.run_attempt }}
          


name: ExtNoBrasil PC Gamer - Mint XFCE

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC de 6 a 8 letras ou numeros"
        required: true
        type: string
      boot_mode:
        description: "Primeira vez installer; depois disk"
        required: true
        type: choice
        default: installer
        options:
          - installer
          - disk

permissions:
  contents: read

jobs:
  virtual-pc:
    name: ExtNoBrasil PC Virtual
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Instalar dependencias
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils novnc websockify \
            socat curl wget ca-certificates

          mkdir -p "$HOME/virtual-pc"

      - name: Restaurar disco virtual
        uses: actions/cache/restore@v4
        with:
          path: ~/virtual-pc/mint.qcow2
          key: mint-xfce-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            mint-xfce-${{ github.repository }}-

      - name: Baixar Linux Mint XFCE
        shell: bash
        run: |
          set -Eeuo pipefail
          DIR="$HOME/virtual-pc"
          DISK="$DIR/mint.qcow2"
          ISO="$DIR/linuxmint.iso"

          # Confere se o disco restaurado e valido.
          if [ -f "$DISK" ]; then
            qemu-img check "$DISK"
          else
            qemu-img create -f qcow2 "$DISK" 145G
          fi

          # XFCE e mais leve que Cinnamon, mas a ISO precisa existir.
          if [ ! -s "$ISO" ]; then
            URL="https://pub.linuxmint.io/stable/22.3/linuxmint-22.3-xfce-64bit.iso"

            if ! wget -O "$ISO" "$URL"; then
              rm -f "$ISO"
              echo "Falha ao baixar a ISO XFCE."
              echo "Confira a versao e o endereco oficial do Linux Mint."
              exit 1
            fi
          fi

          test -s "$ISO"
          qemu-img info "$DISK"
          ls -lh "$ISO"

      - name: Iniciar QEMU
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
          BOOT_MODE: ${{ inputs.boot_mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$VNC_PASSWORD"

          if [[ ! "$VNC_PASSWORD" =~ ^[A-Za-z0-9]{6,8}$ ]]; then
            echo "A senha deve ter entre 6 e 8 letras ou numeros."
            exit 1
          fi

          DIR="$HOME/virtual-pc"
          DISK="$DIR/mint.qcow2"
          ISO="$DIR/linuxmint.iso"

          # TCG e lento; KVM e usado somente quando disponivel.
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=(-enable-kvm)
            CPU=host
            echo "Aceleracao KVM disponivel."
          else
            ACCEL=(-accel tcg,thread=multi)
            CPU=max
            echo "Aviso: emulacao por software; desempenho limitado."
          fi

          case "$BOOT_MODE" in
            installer) BOOT=(-boot order=d,menu=on) ;;
            disk) BOOT=(-boot order=c,menu=on) ;;
            *)
              echo "Modo de boot invalido."
              exit 1
              ;;
          esac

          rm -f /tmp/qemu-monitor.sock /tmp/qemu.log

          qemu-system-x86_64 \
            "${ACCEL[@]}" \
            -machine pc \
            -cpu "$CPU" \
            -smp 2 \
            -m 4096 \
            -drive "file=$DISK,format=qcow2,if=ide" \
            -cdrom "$ISO" \
            "${BOOT[@]}" \
            -vga std \
            -usb \
            -device usb-tablet \
            -rtc base=utc \
            -display none \
            -vnc 127.0.0.1:1,password=on \
            -monitor unix:/tmp/qemu-monitor.sock,server,nowait \
            > /tmp/qemu.log 2>&1 &

          QEMU_PID=$!

          cleanup() {
            kill "${CLOUDFLARED_PID:-}" 2>/dev/null || true
            kill "${WEBSOCKIFY_PID:-}" 2>/dev/null || true
            kill "$QEMU_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            [ -S /tmp/qemu-monitor.sock ] && break
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              cat /tmp/qemu.log
              exit 1
            fi
            sleep 2
          done

          if [ ! -S /tmp/qemu-monitor.sock ]; then
            echo "QEMU nao criou o monitor."
            cat /tmp/qemu.log
            exit 1
          fi

          # Envia a senha ao monitor e confere se houve erro.
          MONITOR_OUTPUT=$(
            printf 'change vnc password %s\n' "$VNC_PASSWORD" |
              socat -T 5 - UNIX-CONNECT:/tmp/qemu-monitor.sock 2>&1 || true
          )

          if grep -qiE 'unknown command|invalid password|error' \
            <<< "$MONITOR_OUTPUT"; then
            echo "Erro ao configurar a senha VNC."
            echo "$MONITOR_OUTPUT"
            exit 1
          fi

          websockify --web=/usr/share/novnc \
            6080 127.0.0.1:5901 \
            > /tmp/websockify.log 2>&1 &
          WEBSOCKIFY_PID=$!

          sleep 3
          if ! kill -0 "$WEBSOCKIFY_PID" 2>/dev/null; then
            cat /tmp/websockify.log
            exit 1
          fi

          # Instala o Cloudflare Tunnel.
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARED_PID=$!

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)

            [ -n "$URL" ] && break
            kill -0 "$CLOUDFLARED_PID" 2>/dev/null || break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Cloudflare nao forneceu um endereco."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo
          echo "===================================="
          echo "     EXT NOBRASIL PC GAMER"
          echo "===================================="
          echo "Sistema: Linux Mint XFCE"
          echo "Disco virtual: 145 GB"
          echo "RAM configurada: 4 GB"
          echo "Nucleos virtuais: 2"
          echo "Modo de boot: $BOOT_MODE"
          echo "Acesso: ${URL}/vnc.html?autoconnect=true&resize=scale"
          echo "Senha VNC: a senha informada ao iniciar o workflow"
          echo "===================================="

          while kill -0 "$QEMU_PID" 2>/dev/null; do
            sleep 10
          done

          echo "QEMU encerrou."
          cat /tmp/qemu.log

      - name: Salvar disco virtual
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/virtual-pc/mint.qcow2
          key: mint-xfce-${{ github.repository }}-${{ github.run_id }}
          

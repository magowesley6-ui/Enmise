
name: ExtNoBrasil PC Gamer - Mint XFCE

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC de 6 a 8 letras ou numeros"
        required: true
        type: string
      boot_mode:
        description: "Primeira vez installer; depois disk"
        required: true
        type: choice
        default: installer
        options:
          - installer
          - disk

permissions:
  contents: write

concurrency:
  group: extnobrasil-mint-pc
  cancel-in-progress: false

jobs:
  virtual-pc:
    name: ExtNoBrasil PC Virtual
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Instalar dependencias
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils novnc websockify \
            socat curl wget ca-certificates jq

          command -v gh
          mkdir -p "$HOME/virtual-pc"

      - name: Restaurar ultimo checkpoint do GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR="$HOME/virtual-pc"
          DISK="$DIR/mint.qcow2"
          PARTS="$DIR/restore-parts"
          JOINED="$DIR/restored-mint.qcow2"

          mkdir -p "$DIR"

          echo "Procurando o ultimo checkpoint publicado..."

          TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            --jq '[.[] |
              select(.isDraft == false) |
              select(.tagName | startswith("mint-checkpoint-"))] |
              sort_by(.publishedAt) | last | .tagName // empty')"

          if [ -n "$TAG" ]; then
            echo "Checkpoint encontrado: $TAG"
            mkdir -p "$PARTS"

            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'mint-checkpoint-*.part' \
              --dir "$PARTS"

            shopt -s nullglob
            FILES=("$PARTS"/mint-checkpoint-*.part)

            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "ERRO: o checkpoint nao tem partes para restaurar."
              exit 1
            fi

            cat "${FILES[@]}" > "$JOINED"
            rm -rf "$PARTS"

            echo "Verificando o disco restaurado..."
            qemu-img check "$JOINED"
            mv "$JOINED" "$DISK"

            echo "Checkpoint restaurado com sucesso."
            qemu-img info "$DISK"
          else
            echo "Nenhum checkpoint anterior encontrado."
            echo "Um disco novo sera criado."
          fi

      - name: Preparar disco virtual
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR="$HOME/virtual-pc"
          DISK="$DIR/mint.qcow2"
          ISO="$DIR/linuxmint.iso"

          if [ -f "$DISK" ]; then
            echo "Usando o disco restaurado."
            qemu-img check "$DISK"
          else
            echo "Criando disco virtual de 145 GB..."
            qemu-img create -f qcow2 "$DISK" 145G
          fi

          if [ ! -s "$ISO" ]; then
            URL="https://pub.linuxmint.io/stable/22.3/linuxmint-22.3-xfce-64bit.iso"

            if ! wget -O "$ISO" "$URL"; then
              rm -f "$ISO"
              echo "ERRO: falha ao baixar a ISO do Linux Mint."
              exit 1
            fi
          fi

          test -s "$ISO"
          qemu-img info "$DISK"

      - name: Iniciar PC Virtual e salvar checkpoint ao encerrar
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
          BOOT_MODE: ${{ inputs.boot_mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::add-mask::$VNC_PASSWORD"

          if [[ ! "$VNC_PASSWORD" =~ ^[A-Za-z0-9]{6,8}$ ]]; then
            echo "A senha deve ter entre 6 e 8 letras ou numeros."
            exit 1
          fi

          DIR="$HOME/virtual-pc"
          DISK="$DIR/mint.qcow2"
          ISO="$DIR/linuxmint.iso"

          MONITOR="/tmp/qemu-monitor.sock"
          QEMU_LOG="/tmp/qemu.log"
          VNC_LOG="/tmp/websockify.log"
          TUNNEL_LOG="/tmp/cloudflared.log"

          QEMU_PID=""
          WEBSOCKIFY_PID=""
          CLOUDFLARED_PID=""

          cleanup() {
            local EXIT_CODE=$?
            local SAVE_OK=1

            trap - EXIT INT TERM
            set +e

            echo
            echo "===================================="
            echo " EXT NOBRASIL - CHECKPOINT"
            echo " Encerrando o PC virtual..."
            echo "===================================="

            # Tenta primeiro desligar o Mint pelo ACPI.
            if [ -n "$QEMU_PID" ] &&
               kill -0 "$QEMU_PID" 2>/dev/null &&
               [ -S "$MONITOR" ]; then
              printf 'system_powerdown\n' |
                socat -T 5 - UNIX-CONNECT:"$MONITOR" \
                >/dev/null 2>&1

              for i in $(seq 1 30); do
                kill -0 "$QEMU_PID" 2>/dev/null || break
                sleep 1
              done

              # Se o Mint nao desligar, fecha o QEMU pelo monitor.
              if kill -0 "$QEMU_PID" 2>/dev/null; then
                printf 'quit\n' |
                  socat -T 5 - UNIX-CONNECT:"$MONITOR" \
                  >/dev/null 2>&1
              fi

              for i in $(seq 1 15); do
                kill -0 "$QEMU_PID" 2>/dev/null || break
                sleep 1
              done

              if kill -0 "$QEMU_PID" 2>/dev/null; then
                echo "Aviso: QEMU nao encerrou; enviando TERM."
                kill -TERM "$QEMU_PID" 2>/dev/null

                for i in $(seq 1 5); do
                  kill -0 "$QEMU_PID" 2>/dev/null || break
                  sleep 1
                done
              fi

              if kill -0 "$QEMU_PID" 2>/dev/null; then
                echo "AVISO: encerramento forcado do QEMU."
                kill -KILL "$QEMU_PID" 2>/dev/null
              fi

              wait "$QEMU_PID" 2>/dev/null
            fi

            if [ -n "$CLOUDFLARED_PID" ]; then
              kill "$CLOUDFLARED_PID" 2>/dev/null
              wait "$CLOUDFLARED_PID" 2>/dev/null
            fi

            if [ -n "$WEBSOCKIFY_PID" ]; then
              kill "$WEBSOCKIFY_PID" 2>/dev/null
              wait "$WEBSOCKIFY_PID" 2>/dev/null
            fi

            rm -f "$MONITOR"

            # Nunca cria um backup enquanto o QEMU usa o disco.
            if [ ! -s "$DISK" ]; then
              echo "ERRO: disco virtual nao encontrado."
              SAVE_OK=0
            elif ! qemu-img check "$DISK"; then
              echo "ERRO: verificacao do disco falhou."
              SAVE_OK=0
            else
              sync

              BACKUP="$DIR/mint-checkpoint.qcow2"
              PARTS="$DIR/checkpoint-parts"

              rm -rf "$PARTS"
              mkdir -p "$PARTS"
              rm -f "$BACKUP"

              echo "Preparando imagem compactada..."
              if qemu-img convert -p -c -O qcow2 \
                "$DISK" "$BACKUP"; then

                echo "Dividindo backup em partes de 1800 MB..."
                if split -b 1800M -d -a 4 \
                  --additional-suffix=.part \
                  "$BACKUP" "$PARTS/mint-checkpoint-"; then

                  # Libera espaco temporario antes do upload.
                  rm -f "$BACKUP"

                  shopt -s nullglob
                  FILES=("$PARTS"/mint-checkpoint-*.part)

                  if [ "${#FILES[@]}" -eq 0 ]; then
                    echo "ERRO: nenhuma parte foi criada."
                    SAVE_OK=0
                  else
                    TAG="mint-checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                    RELEASE_CREATED=0

                    echo "Criando checkpoint no GitHub Releases..."

                    if gh release create "$TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --draft \
                      --title "Mint Checkpoint ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                      --notes "Backup automatico do PC virtual ExtNoBrasil."; then
                      RELEASE_CREATED=1
                    else
                      echo "ERRO: nao foi possivel criar a Release."
                      SAVE_OK=0
                    fi

                    if [ "$RELEASE_CREATED" -eq 1 ]; then
                      if gh release upload "$TAG" "${FILES[@]}" \
                        --repo "$GITHUB_REPOSITORY"; then

                        RELEASE_ID="$(gh api \
                          "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                          --jq '.id')"

                        if gh api \
                          "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                          -X PATCH -F draft=false >/dev/null; then

                          echo "Checkpoint publicado com sucesso."

                          # Mantem apenas o checkpoint mais recente.
                          OLD_TAGS="$(gh release list \
                            --repo "$GITHUB_REPOSITORY" \
                            --limit 100 \
                            --json tagName,isDraft \
                            --jq '.[] |
                              select(.isDraft == false) |
                              select(.tagName | startswith("mint-checkpoint-")) |
                              .tagName' 2>/dev/null)"

                          while IFS= read -r OLD_TAG; do
                            [ -n "$OLD_TAG" ] || continue
                            [ "$OLD_TAG" != "$TAG" ] || continue

                            echo "Removendo checkpoint antigo: $OLD_TAG"
                            gh release delete "$OLD_TAG" \
                              --repo "$GITHUB_REPOSITORY" \
                              --yes --cleanup-tag \
                              || echo "Aviso: nao foi possivel remover $OLD_TAG."
                          done <<< "$OLD_TAGS"

                        else
                          echo "ERRO: nao foi possivel publicar a Release."
                          SAVE_OK=0
                        fi
                      else
                        echo "ERRO: upload incompleto."
                        echo "A Release incompleta continuara como rascunho."
                        SAVE_OK=0
                      fi
                    fi
                  fi
                else
                  echo "ERRO: falha ao dividir o backup."
                  SAVE_OK=0
                fi
              else
                echo "ERRO: falha ao compactar o disco."
                SAVE_OK=0
              fi

              rm -rf "$PARTS"
              rm -f "$BACKUP"
            fi

            if [ "$SAVE_OK" -eq 1 ]; then
              echo "Resultado: checkpoint salvo."
            else
              echo "Resultado: NAO foi possivel confirmar o backup."
              if [ "$EXIT_CODE" -eq 0 ]; then
                EXIT_CODE=1
              fi
            fi

            rm -f "$MONITOR"
            exit "$EXIT_CODE"
          }

          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if [ -c /dev/kvm ] &&
             [ -r /dev/kvm ] &&
             [ -w /dev/kvm ]; then
            ACCEL=(-enable-kvm)
            CPU=host
            echo "Aceleracao KVM disponivel."
          else
            ACCEL=(-accel tcg,thread=multi)
            CPU=max
            echo "Aviso: emulacao por software; desempenho limitado."
          fi

          case "$BOOT_MODE" in
            installer)
              BOOT=(-boot order=d,menu=on)
              ;;
            disk)
              BOOT=(-boot order=c,menu=on)
              ;;
            *)
              echo "Modo de boot invalido."
              exit 1
              ;;
          esac

          rm -f "$MONITOR" "$QEMU_LOG"

          qemu-system-x86_64 \
            "${ACCEL[@]}" \
            -machine pc \
            -cpu "$CPU" \
            -smp 2 \
            -m 4096 \
            -drive "file=$DISK,format=qcow2,if=ide" \
            -cdrom "$ISO" \
            "${BOOT[@]}" \
            -vga std \
            -usb \
            -device usb-tablet \
            -rtc base=utc \
            -display none \
            -vnc 127.0.0.1:1,password=on \
            -monitor unix:"$MONITOR",server,nowait \
            > "$QEMU_LOG" 2>&1 &

          QEMU_PID=$!

          for i in $(seq 1 40); do
            [ -S "$MONITOR" ] && break

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              cat "$QEMU_LOG"
              exit 1
            fi

            sleep 2
          done

          if [ ! -S "$MONITOR" ]; then
            echo "QEMU nao criou o monitor."
            cat "$QEMU_LOG"
            exit 1
          fi

          MONITOR_OUTPUT="$(
            printf 'change vnc password %s\n' "$VNC_PASSWORD" |
              socat -T 5 - UNIX-CONNECT:"$MONITOR" 2>&1 || true
          )"

          if grep -qiE 'unknown command|invalid password|error' \
            <<< "$MONITOR_OUTPUT"; then
            echo "Erro ao configurar a senha VNC."
            echo "$MONITOR_OUTPUT"
            exit 1
          fi

          websockify --web=/usr/share/novnc \
            6080 127.0.0.1:5901 \
            > "$VNC_LOG" 2>&1 &
          WEBSOCKIFY_PID=$!

          sleep 3

          if ! kill -0 "$WEBSOCKIFY_PID" 2>/dev/null; then
            cat "$VNC_LOG"
            exit 1
          fi

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > "$TUNNEL_LOG" 2>&1 &
          CLOUDFLARED_PID=$!

          URL=""

          for i in $(seq 1 60); do
            URL="$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              "$TUNNEL_LOG" | head -n 1 || true)"

            [ -n "$URL" ] && break
            kill -0 "$CLOUDFLARED_PID" 2>/dev/null || break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Cloudflare nao forneceu um endereco."
            cat "$TUNNEL_LOG"
            exit 1
          fi

          echo
          echo "===================================="
          echo "     EXT NOBRASIL PC GAMER"
          echo "===================================="
          echo "Sistema: Linux Mint XFCE"
          echo "Disco virtual: 145 GB"
          echo "RAM configurada: 4 GB"
          echo "Nucleos virtuais: 2"
          echo "Modo de boot: $BOOT_MODE"
          echo "Acesso: ${URL}/vnc.html?autoconnect=true&resize=scale"
          echo "Senha VNC: a senha informada no workflow"
          echo "Checkpoint: GitHub Releases"
          echo "===================================="

          # Reserva tempo para encerrar e tentar salvar antes do limite.
          SESSION_START=$SECONDS
          SESSION_LIMIT=18000

          while kill -0 "$QEMU_PID" 2>/dev/null; do
            if (( SECONDS - SESSION_START >= SESSION_LIMIT )); then
              echo "Limite de sessao atingido; iniciando salvamento."
              break
            fi
            sleep 5
          done

          echo "Iniciando finalizacao da sessao."
          

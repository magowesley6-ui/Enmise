name: ExtNoBrasil PC Gamer - Windows 11

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC (6 a 8 caracteres)"
        required: true
        type: string
        default: "ExT2026"

permissions:
  contents: read

jobs:
  pc-virtual:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Instalar componentes
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils ovmf \
            novnc websockify socat curl wget \
            openssh-client ca-certificates

      - name: Verificar ISO do Windows
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "::error::Configure o segredo WINDOWS_ISO_URL com uma URL válida da ISO do Windows 11."
            exit 1
          fi

          mkdir -p "$HOME/virtual-pc"
          cd "$HOME/virtual-pc"

          if [ ! -f windows11.iso ]; then
            curl -fL --retry 3 \
              "$WINDOWS_ISO_URL" \
              -o windows11.iso
          fi

          qemu-img create -f qcow2 windows11.qcow2 80G

      - name: Iniciar PC virtual
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          set -Eeuo pipefail
          cd "$HOME/virtual-pc"

          # Inicia o QEMU com UEFI e instalador do Windows.
          qemu-system-x86_64 \
            -name "ExtNoBrasil PC Gamer" \
            -machine q35,accel=kvm:tcg \
            -cpu max \
            -smp 4 \
            -m 6G \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive file=windows11.qcow2,format=qcow2,if=virtio \
            -cdrom windows11.iso \
            -boot order=d \
            -vga std \
            -device usb-tablet \
            -netdev user,id=net0 \
            -device e1000,netdev=net0 \
            -monitor unix:"$HOME/qemu-monitor.sock",server,nowait \
            -vnc 127.0.0.1:0,password=on \
            -daemonize

          sleep 3

          # Define a senha VNC.
          printf 'change vnc password %s\n' "$VNC_PASSWORD" |
            socat - UNIX-CONNECT:"$HOME/qemu-monitor.sock"

      - name: Iniciar noVNC
        run: |
          set -Eeuo pipefail

          websockify \
            --web=/usr/share/novnc \
            6080 localhost:5900 \
            > "$HOME/novnc.log" 2>&1 &

          sleep 3

          if ! curl -fsS http://127.0.0.1:6080/ >/dev/null; then
            echo "::error::O servidor noVNC não iniciou."
            cat "$HOME/novnc.log"
            exit 1
          fi

      - name: Publicar acesso pelo navegador
        run: |
          set -Eeuo pipefail

          # O Cloudflare Tunnel exige o executável cloudflared.
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O "$HOME/cloudflared"

          chmod +x "$HOME/cloudflared"

          "$HOME/cloudflared" tunnel \
            --url http://127.0.0.1:6080 \
            > "$HOME/cloudflared.log" 2>&1 &

          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$HOME/cloudflared.log" | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo "======================================"
              echo "ExtNoBrasil PC Gamer"
              echo "Acesso pelo navegador: $URL/vnc.html"
              echo "Senha VNC: configure a senha informada"
              echo "======================================"
              break
            fi

            sleep 2
          done

          if [ -z "${URL:-}" ]; then
            echo "::error::Não foi possível obter o link noVNC."
            cat "$HOME/cloudflared.log"
            exit 1
          fi

      - name: Manter sessão ativa
        run: |
          echo "O PC virtual ficará disponível enquanto o job estiver ativo."
          echo "O disco não tem backup permanente neste workflow."
          sleep 18000

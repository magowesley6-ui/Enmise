
name: ExtNoBrasil PC - Garuda Linux bVNC

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC (1 a 8 caracteres alfanumericos)"
        required: true
        type: string
      edition:
        description: "Edicao do Garuda"
        type: choice
        options:
          - xfce
          - kde-lite
          - dr460nized
          - gnome
          - cinnamon
          - mokka
          - dr460nized-gaming
        default: xfce
      fresh_install:
        description: "Comecar com disco novo?"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  garuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      VNC_PASS: ${{ inputs.vnc_password }}
      DISK: 80G
      MAX_SECONDS: 21000

    steps:
      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VNC_PASS" =~ ^[a-zA-Z0-9]{1,8}$ ]]; then
            echo "ERRO: use de 1 a 8 letras ou numeros para a senha."
            exit 1
          fi

          echo "::add-mask::$VNC_PASS"
          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

          sudo apt-get update -qq
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils curl wget ca-certificates \
            zstd aria2 socat openssh-client netcat-openbsd python3

      - name: Restaurar disco anterior
        if: ${{ !inputs.fresh_install }}
        uses: actions/cache/restore@v4
        with:
          path: ~/garuda-save
          key: garuda-bvnc-${{ github.run_id }}
          restore-keys: |
            garuda-bvnc-

      - name: Baixar ISO e preparar disco
        shell: bash
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/garuda" "$HOME/garuda-save"

          if [ -w /dev/kvm ]; then
            echo "ACCEL=kvm" >> "$GITHUB_ENV"
            echo "CPU_OPT=host" >> "$GITHUB_ENV"
            echo "Aceleracao KVM disponivel."
          else
            echo "ACCEL=tcg,thread=multi" >> "$GITHUB_ENV"
            echo "CPU_OPT=max" >> "$GITHUB_ENV"
            echo "AVISO: sem KVM, o sistema pode ficar muito lento."
          fi

          ISO="$HOME/garuda/garuda.iso"
          ISO_URL="https://iso.builds.garudalinux.org/iso/latest/garuda/${EDITION}/latest.iso"

          aria2c -x 4 -s 4 -k 1M -d "$HOME/garuda" \
            -o garuda.iso "$ISO_URL" || {
              echo "ERRO: nao foi possivel baixar a ISO."
              exit 1
            }

          if [ ! -s "$ISO" ]; then
            echo "ERRO: ISO vazia."
            exit 1
          fi

          ZST="$HOME/garuda-save/garuda.qcow2.zst"
          SZ="$HOME/garuda-save/garuda.size"
          RESTORED=false

          if [ -f "$ZST" ] && [ -f "$SZ" ]; then
            NEED=$(cat "$SZ")
            FREE=$(df --output=avail -B1 "$HOME" | tail -1)
            if [[ "$NEED" =~ ^[0-9]+$ ]] &&
               [ "$NEED" -lt "$((FREE - 2000000000))" ]; then
              if zstd -t "$ZST" >/dev/null 2>&1; then
                zstd -d -f "$ZST" -o "$HOME/garuda/garuda.qcow2"
                RESTORED=true
              fi
            fi
          fi

          if [ "$RESTORED" = false ]; then
            qemu-img create -f qcow2 \
              "$HOME/garuda/garuda.qcow2" "$DISK"
          fi

          echo "RESTORED=$RESTORED" >> "$GITHUB_ENV"

      - name: Iniciar maquina virtual
        shell: bash
        env:
          ACCEL: ${{ env.ACCEL }}
          CPU_OPT: ${{ env.CPU_OPT }}
        run: |
          set -euo pipefail

          MEM=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          MEM=$((MEM - 1500))
          [ "$MEM" -gt 8192 ] && MEM=8192
          [ "$MEM" -lt 1536 ] && MEM=1536
          CPUS=$(nproc)

          echo "RAM_VM=$MEM" >> "$GITHUB_ENV"
          echo "CPUS_VM=$CPUS" >> "$GITHUB_ENV"

          nohup qemu-system-x86_64 \
            -machine q35 \
            -accel "$ACCEL" \
            -cpu "$CPU_OPT" \
            -smp "$CPUS" \
            -m "${MEM}M" \
            -drive file="$HOME/garuda/garuda.qcow2",if=virtio,format=qcow2 \
            -cdrom "$HOME/garuda/garuda.iso" \
            -boot order=cd \
            -vga std \
            -device qemu-xhci \
            -device usb-tablet \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -vnc 127.0.0.1:0,password=on \
            -monitor unix:"$HOME/garuda/monitor.sock",server,nowait \
            > "$HOME/garuda/qemu.log" 2>&1 &

          echo $! > "$HOME/garuda/qemu.pid"

          for i in $(seq 1 30); do
            sleep 2
            if [ -S "$HOME/garuda/monitor.sock" ]; then
              break
            fi
          done

          if [ ! -S "$HOME/garuda/monitor.sock" ]; then
            cat "$HOME/garuda/qemu.log"
            echo "ERRO: QEMU nao iniciou."
            exit 1
          fi

          python3 - "$VNC_PASS" "$HOME/garuda/monitor.sock" <<'PY'
          import socket, sys, time
          password, path = sys.argv[1], sys.argv[2]
          s = socket.socket(socket.AF_UNIX)
          s.connect(path)
          time.sleep(1)
          try:
              s.recv(4096)
          except Exception:
              pass
          s.sendall(b"change vnc password\n")
          time.sleep(1)
          try:
              s.recv(4096)
          except Exception:
              pass
          s.sendall(password.encode() + b"\n")
          time.sleep(1)
          s.close()
          PY

      - name: Abrir tunel TCP para bVNC
        shell: bash
        run: |
          set -euo pipefail

          nohup ssh -T \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -p 443 -R 0:127.0.0.1:5900 \
            tcp@a.pinggy.io \
            > "$HOME/garuda/pinggy.log" 2>&1 &

          echo $! > "$HOME/garuda/tunnel.pid"

          SERVER=""
          PORT=""

          for i in $(seq 1 60); do
            sleep 2
            MATCH=$(grep -oE 'tcp://[^[:space:]]+:[0-9]+' \
              "$HOME/garuda/pinggy.log" | tail -1 || true)

            if [ -n "$MATCH" ]; then
              SERVER=$(printf '%s' "$MATCH" |
                sed -E 's#tcp://([^:]+):.*#\1#')
              PORT=$(printf '%s' "$MATCH" |
                sed -E 's#.*:([0-9]+)$#\1#')
              break
            fi

            if ! kill -0 "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null; then
              break
            fi
          done

          if [ -z "$SERVER" ] || [ -z "$PORT" ]; then
            echo "ERRO: nao foi possivel obter servidor e porta TCP."
            cat "$HOME/garuda/pinggy.log" || true
            exit 1
          fi

          echo "================================"
          echo "Servidor: $SERVER"
          echo "Porta: $PORT"
          echo "================================"

      - name: Manter sessao ativa
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TS))

            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Limite interno atingido."
              break
            fi

            if ! kill -0 "$(cat "$HOME/garuda/qemu.pid")" 2>/dev/null; then
              echo "Maquina virtual encerrada."
              break
            fi

            if ! kill -0 "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null; then
              echo "Tunel desconectado."
              break
            fi

            sleep 30
          done

      - name: Encerrar processos
        if: always()
        shell: bash
        run: |
          if [ -S "$HOME/garuda/monitor.sock" ]; then
            printf 'quit\n' |
              socat - UNIX-CONNECT:"$HOME/garuda/monitor.sock" || true
          fi

          if [ -f "$HOME/garuda/tunnel.pid" ]; then
            kill "$(cat "$HOME/garuda/tunnel.pid")" 2>/dev/null || true
          fi

      - name: Compactar disco
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$HOME/garuda/garuda.qcow2" ]; then
            echo "Disco nao encontrado; nada para salvar."
            exit 0
          fi

          if pgrep -f '[q]emu-system-x86_64' >/dev/null; then
            echo "QEMU ainda esta ativo; nao vou compactar o disco."
            exit 0
          fi

          mkdir -p "$HOME/garuda-save"

          qemu-img convert -f qcow2 -O qcow2 \
            "$HOME/garuda/garuda.qcow2" \
            "$HOME/garuda-save/compact.qcow2"

          zstd -T0 -1 -f \
            "$HOME/garuda-save/compact.qcow2" \
            -o "$HOME/garuda-save/garuda.qcow2.zst"

          stat -c%s "$HOME/garuda-save/compact.qcow2" \
            > "$HOME/garuda-save/garuda.size"

          rm -f "$HOME/garuda-save/compact.qcow2"

          SIZE=$(stat -c%s "$HOME/garuda-save/garuda.qcow2.zst")
          if [ "$SIZE" -gt 9800000000 ]; then
            echo "Arquivo maior que o limite aproximado do cache."
            exit 0
          fi

          echo "SAVE_READY=true" >> "$GITHUB_ENV"

      - name: Salvar disco no cache
        if: ${{ always() && env.SAVE_READY == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/garuda-save
          key: garuda-bvnc-${{ github.run_id }}-${{ github.run_attempt }}
          
